      const pl = S.plan, tg = S.targets, g = arr(pl?.gunler)[planDay], o = arr(g?.ogunler)[+a.dataset.o]; if (!o) return;
      const kc = Math.round(num(o.kcal)), m = ogunToMeal(o.ogun), k = tg?.kcal ? kc / tg.kcal : 0;
      const t = ymd(new Date()); const D = day(t);
      const ic = String(o.icerik || o.ogun); D.foods.push({ id: uid(), meal: m, name: ic.length > 60 ? ic.slice(0, 58) + "…" : ic, amount: "Programdan", kcal: kc, p: r1(tg.protein * k), c: r1(tg.carb * k), f: r1(tg.fat * k), planKey: `${planDay}-${a.dataset.o}-${pl.at}` });
      save(); renderPlan(); toast(`${m} öğününe ${kc} kcal eklendi`);
    },
    wstep: () => { wStep = Math.max(30, Math.min(350, Math.round((wStep + num(a.dataset.n)) * 10) / 10)); renderWeight(); },
    wtype: () => { const v = prompt("Kilo (kg)", String(wStep).replace(".", ",")); if (v === null) return; const n = r1(v); if (n < 30 || n > 350) return toast("Geçerli bir kilo gir", 1); wStep = n; renderWeight(); },
    theme: () => { S.settings.theme = a.dataset.t; save(); applyTheme(); renderProfile(); },
    sheet: () => openSheet(a.dataset.k),
    closeSheet,
    meal: () => { draft.meal = a.dataset.m; if (draft.preview) draft.preview.meal = a.dataset.m; renderToday(); focusAdd(); },
    quickAdd: () => { if (view !== "today") go("today"); else renderToday(); focusAdd(true); },
    wunit: () => { S.settings.waterUnit = a.dataset.u; save(); render(); },
    setWater: () => { const v = num($("#wL").value); if (v < 0 || v > 10) return toast("Geçerli bir litre gir", 1); d().waterMl = Math.round(v * 1000); save(); renderToday(); },
    applyAdj: () => {
      const v = Math.round(num(a.dataset.v)); if (!v || !S.targets) return;
      const tg = S.targets; tg.history = [...arr(tg.history), { at: Date.now(), from: tg.kcal, to: v }];
      const k = v / tg.kcal; tg.carb = Math.round(tg.carb * (1 + (k - 1) * 1.4)); tg.fat = Math.round(tg.fat * (1 + (k - 1) * 0.6)); // proteini koru, farkı karb/yağdan al
      tg.kcal = v; tg.at = Date.now(); save();
      if (a.dataset.plan) makePlan(v); else { toast(`Yeni hedef: ${fmt(v)} kcal`); renderPlan(); }
    },
    toggleManual: () => { draft.manual = !draft.manual; renderToday(); },
    toggleEx: () => { draft.exManual = !draft.exManual; renderToday(); },
    calcFood, calcEx: calcExercise, review: reviewDay, makeplan: () => makePlan(),
    addManual: () => {
      const n = $("#mName").value.trim(), k = num($("#mKcal").value);
      if (!n || !k) return toast("Ad ve kalori gir", 1);
      addFoods([{ name: n, kcal: k }], draft.meal); renderToday(); toast("Eklendi");
    },
    confirmPrev: () => {
      const items = draft.preview.items.filter(i => i.on);
      if (!items.length) return toast("En az bir kalem seç", 1);
      addFoods(items, draft.preview.meal); draft.preview = null; draft.food = ""; draft.photo = null; renderToday(); toast("Öğüne eklendi");
    },
    cancelPrev: () => { draft.preview = null; renderToday(); },
    recent: () => { const r = S.recent[+a.dataset.i]; if (r) { addFoods([r], draft.meal); renderToday(); toast(`${r.name} → ${draft.meal}`); } },
    editFood: () => {
      const f = d().foods.find(x => x.id === a.dataset.id); if (!f) return;
      const v = prompt(`${f.name} – kalori`, f.kcal); if (v === null) return;
      const nv = Math.round(num(v)); if (!nv) return;
      const k = f.kcal ? nv / f.kcal : 1; f.p = r1(f.p * k); f.c = r1(f.c * k); f.f = r1(f.f * k); f.kcal = nv;
      save(); renderToday();
    },
    delFood: () => { const D = d(); D.foods = D.foods.filter(x => x.id !== a.dataset.id); save(); renderToday(); },
    delEx: () => { const D = d(); D.exercises = D.exercises.filter(x => x.id !== a.dataset.id); save(); renderToday(); },
    addExManual: () => {
      const n = $("#exName").value.trim() || "Antrenman", k = Math.round(num($("#exKcal").value));
      if (!k) return toast("Yakılan kaloriyi gir", 1);
      d().exercises.push({ id: uid(), desc: n, kcal: k }); save(); renderToday(); toast("Hedefine eklendi");
    },
    water: () => { const D = d(); D.waterMl = Math.max(0, D.waterMl + +a.dataset.ml); save(); renderToday(); },
    clearReview: () => { const D = d(); D.review = null; D.closed = false; save(); renderToday(); },
    pday: () => { planDay = +a.dataset.i; renderPlan(); },
    wr: () => { wRange = +a.dataset.v; renderWeight(); },
    addW: () => {
      const kg = r1(wStep), dt = wDate || ymd(new Date());
      if (kg < 30 || kg > 350) return toast("Geçerli bir kilo gir", 1);
      S.weights = S.weights.filter(w => w.date !== dt).concat({ date: dt, kg });
      if (S.profile && dt >= (sortedWeights().slice(-1)[0]?.date || "")) S.profile.kilo = latestWeight();
      wDate = ymd(new Date()); save(); renderWeight(); toast("Kaydedildi");
    },
    delW: () => { if (!confirm("Bu ölçüm silinsin mi?")) return; S.weights = S.weights.filter(w => w.date !== a.dataset.d); wStep = null; save(); renderWeight(); },
    goalEx: () => { const t = document.querySelector('[name="amac"]'); t.value = GOAL_EXAMPLES[+a.dataset.i]; t.focus(); },
    saveUrl: () => { S.settings.workerUrl = $("#wurl").value.trim(); save(); toast("Kaydedildi"); },
    testAi: async () => {
      S.settings.workerUrl = $("#wurl").value.trim(); save();
      busy("Bağlantı deneniyor…");
      try {
        const t = Date.now();
        const res = await fetch((S.settings.workerUrl || DEFAULT_WORKER).trim(), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system: "Sadece JSON döndür.", prompt: 'Şunu döndür: {"durum":"tamam"}', temperature: 0, mode: "fast" }) });
        const d = await res.json().catch(() => ({}));
        if (!res.ok || d.error) throw new Error((d.error || "Hata " + res.status) + (d.detail ? " — " + d.detail.slice(0, 200) : ""));
        toast(`Bağlantı çalışıyor ✓ (${String(d.model).replace("@cf/meta/", "").replace("-instruct-fp8-fast", "")}${d.fallback ? ", yedek" : ""}, ${((Date.now() - t) / 1000).toFixed(1)} sn)`);
      }
      catch (e) { toast(e.message, 1); } finally { busy(); }
    },
    export: exportData,
    import: () => $("#impFile").click(),
    reset: () => { if (confirm("Tüm kayıtların silinecek" + (Cloud.user ? " (buluttakiler dahil)" : "") + ". Emin misin?") && confirm("Geri alınamaz. Siliyorum?")) { const st = S.settings; S = defaults(); S.settings = { ...S.settings, workerUrl: st.workerUrl, theme: st.theme }; save(); go("profile"); } },
    logout: () => { if (confirm("Çıkış yapılsın mı? Kayıtların bulutta kalır.")) Cloud.logout(); },
    login: () => Cloud.auth("login"), signup: () => Cloud.auth("signup"), forgot: () => Cloud.auth("forgot"),
  };
  if (H[act]) { e.preventDefault(); H[act](); }
});

async function exportData() {
  const name = `fittrack-yedek-${ymd(new Date())}.json`;
  const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Fit Track yedeği" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o !== "object" || !("days" in o)) throw 0;
      if (!confirm("Mevcut verilerin yedektekilerle değiştirilecek. Devam?")) return;
      const u = S.settings.workerUrl; S = Object.assign(defaults(), o); if (!S.settings.workerUrl) S.settings.workerUrl = u;
      save(); toast("Yedek yüklendi"); go("today");
    } catch (e) { toast("Geçersiz yedek dosyası", 1); }
  };
  r.readAsText(file);
}

/* ============ Bulut (Firebase) ============ */
const Cloud = {
  fb: null, user: null, last: { meta: null, days: {} }, timer: null, pending: false, online: navigator.onLine, unsub: [],
  statusText() { return !this.online ? "Çevrimdışı – bağlantı gelince eşitlenecek." : this.pending ? "Eşitleniyor…" : "Eşitlendi ✓"; },
  meta(s = S) { const { days, ...m } = s; return JSON.parse(JSON.stringify(m)); },
  clean(o) { return JSON.parse(JSON.stringify(o)); },
  isEmptyDay(d) { return !d || (!d.foods?.length && !d.exercises?.length && !d.waterMl && !d.review); },

  async init() {
    if (!FIREBASE_CONFIG) { go(S.profile ? "today" : "profile"); return; }
    showAuth("loading");
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      const auth = authM.getAuth(app);
      await authM.setPersistence(auth, authM.indexedDBLocalPersistence).catch(() => {});
      let db;
      try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache() }); } catch (e) { db = fsM.getFirestore(app); }
      this.fb = { authM, fsM, auth, db };
      authM.onAuthStateChanged(auth, u => this.onUser(u));
    } catch (e) {
      // Firebase yüklenemezse (ör. ilk açılış çevrimdışı) son kullanıcının yerel verisiyle aç
      const lastUid = localStorage.getItem("fittrack_last_uid");
      if (lastUid) { storeKey = KEY + "_" + lastUid; S = load(); hideAuth(); go(S.profile ? "today" : "profile"); toast("Çevrimdışı açıldı; bağlantı gelince yeniden aç.", 1); }
      else showAuth("login", "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.");
    }
    addEventListener("online", () => { this.online = true; this.flush(); });
    addEventListener("offline", () => { this.online = false; });
  },

  async onUser(u) {
    this.unsub.forEach(f => f()); this.unsub = [];
    this.user = u;
    if (!u) { S = defaults(); storeKey = KEY; showAuth("login"); return; }
    localStorage.setItem("fittrack_last_uid", u.uid);
    storeKey = KEY + "_" + u.uid;
    S = load();                         // önce yerel önbellek: anında açılır
    hideAuth(); go(S.profile ? "today" : "profile");
    try { await this.pull(true); } catch (e) { console.warn(e); }
    this.listen();
  },

  ref(...p) { const { fsM, db } = this.fb; return p.length % 2 ? fsM.collection(db, "users", this.user.uid, ...p) : fsM.doc(db, "users", this.user.uid, ...p); },

  async pull(first) {
    const { fsM } = this.fb;
    const [mSnap, dSnap] = await Promise.all([fsM.getDoc(fsM.doc(this.fb.db, "users", this.user.uid)), fsM.getDocs(this.ref("days"))]);
    const remoteDays = {}; dSnap.forEach(x => remoteDays[x.id] = x.data());
    if (!mSnap.exists() && !dSnap.size) {
      // Bulutta hiç veri yok: bu cihazdaki (giriş öncesi) verileri taşı
      const legacy = load(KEY), mine = load();
      const src = mine.profile || Object.keys(mine.days).length ? mine : legacy;
      if (src.profile || Object.keys(src.days).length) { S = src; if (src === legacy) toast("Bu cihazdaki kayıtların hesabına aktarılıyor"); }
      this.last = { meta: null, days: {} };
      save(); await this.flush(); this.afterPull();
    } else {
      const m = mSnap.exists() ? mSnap.data() : {};
      S = Object.assign(defaults(), m, { days: remoteDays });
      if (!S.settings?.workerUrl) S.settings = { ...(S.settings || {}), workerUrl: DEFAULT_WORKER };
      this.last.meta = JSON.stringify(this.meta());
      this.last.days = {}; Object.entries(remoteDays).forEach(([k, v]) => this.last.days[k] = JSON.stringify(v));
      try { localStorage.setItem(storeKey, JSON.stringify(S)); } catch (e) {}
      this.afterPull();
    }
  },
  afterPull() { if (view === "profile" && S.profile && !document.activeElement?.closest?.("#pf")) go("today"); else render(); },

  listen() {
    const { fsM } = this.fb;
    // Diğer cihazlardan gelen değişiklikleri canlı al
    this.unsub.push(fsM.onSnapshot(fsM.doc(this.fb.db, "users", this.user.uid), snap => {
      if (snap.metadata.hasPendingWrites || !snap.exists()) return;
      const str = JSON.stringify(snap.data());
      if (str === this.last.meta) return;
      this.last.meta = str; const days = S.days; S = Object.assign(defaults(), snap.data(), { days }); this.saveLocal(); this.softRender();
    }));
    this.unsub.push(fsM.onSnapshot(this.ref("days"), snap => {
      let changed = false;
      snap.docChanges().forEach(ch => {
        if (ch.doc.metadata.hasPendingWrites) return;
        const k = ch.doc.id;
        if (ch.type === "removed") { if (S.days[k]) { delete S.days[k]; delete this.last.days[k]; changed = true; } return; }
        const str = JSON.stringify(ch.doc.data());
        if (str === this.last.days[k]) return;
        this.last.days[k] = str; S.days[k] = ch.doc.data(); changed = true;
      });
      if (changed) { this.saveLocal(); this.softRender(); }
    }));
  },
  saveLocal() { try { localStorage.setItem(storeKey, JSON.stringify(S)); } catch (e) {} },
  softRender() { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; render(); },

  schedule() {
    if (!this.user || !this.fb) return;
    this.pending = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 700);
  },
  async flush() {
    if (!this.user || !this.fb) return;
    clearTimeout(this.timer);
    const { fsM, db } = this.fb, uid = this.user.uid, ops = [];
    const m = this.meta(), ms = JSON.stringify(m);
    if (ms !== this.last.meta) { ops.push(fsM.setDoc(fsM.doc(db, "users", uid), m)); this.last.meta = ms; }
    const keys = new Set([...Object.keys(S.days), ...Object.keys(this.last.days)]);
    keys.forEach(k => {
      const d = S.days[k];
      if (this.isEmptyDay(d)) {
        if (this.last.days[k] !== undefined) { ops.push(fsM.deleteDoc(fsM.doc(db, "users", uid, "days", k))); delete this.last.days[k]; }
        return;
      }
      const c = this.clean(d), s = JSON.stringify(c);
      if (s !== this.last.days[k]) { ops.push(fsM.setDoc(fsM.doc(db, "users", uid, "days", k), c)); this.last.days[k] = s; }
    });
    // Çevrimdışıyken yazmalar Firestore önbelleğinde kuyruğa girer, bağlantı gelince gönderilir
    try { await Promise.all(ops); this.pending = false; }
    catch (e) { console.warn(e); this.last.meta = null; toast("Buluta kaydedilemedi: " + (e.code || e.message), 1); }
  },

  async auth(mode) {
    const { authM, auth } = this.fb || {};
    if (!auth) return;
    const email = $("#auEmail").value.trim(), pass = $("#auPass").value;
    const err = m => { $("#auErr").textContent = m; };
    err("");
    try {
      if (mode === "forgot") {
        if (!email) return err("E-posta adresini yaz.");
        await authM.sendPasswordResetEmail(auth, email); return err("Şifre sıfırlama bağlantısı e-postana gönderildi.");
      }
      if (!email || !pass) return err("E-posta ve şifre gir.");
      busy(mode === "signup" ? "Hesap oluşturuluyor…" : "Giriş yapılıyor…");
      if (mode === "signup") {
        if (pass.length < 6) { busy(); return err("Şifre en az 6 karakter olmalı."); }
        await authM.createUserWithEmailAndPassword(auth, email, pass);
      } else await authM.signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      const M = { "auth/invalid-credential": "E-posta veya şifre hatalı.", "auth/wrong-password": "Şifre hatalı.", "auth/user-not-found": "Bu e-postayla hesap yok. Hesap oluştur.",
        "auth/email-already-in-use": "Bu e-postayla zaten hesap var. Giriş yap.", "auth/invalid-email": "Geçersiz e-posta adresi.", "auth/weak-password": "Şifre en az 6 karakter olmalı.",
        "auth/too-many-requests": "Çok fazla deneme. Biraz bekle.", "auth/network-request-failed": "İnternet bağlantısı yok.", "auth/unauthorized-domain": "Bu adres Firebase'de yetkili değil (Authorized domains)." };
      err(M[e.code] || e.message);
    } finally { busy(); }
  },
  async logout() { await this.flush(); await this.fb.authM.signOut(this.fb.auth); }
};

function showAuth(mode, msg) {
  applyTheme();
  let el = $("#auth");
  if (!el) { el = document.createElement("div"); el.id = "auth"; document.body.appendChild(el); }
  el.style.display = "flex";
  el.innerHTML = mode === "loading"
    ? `<div class="spin" style="border-color:var(--ac2);border-top-color:var(--ac)"></div>`
    : `<div class="aubox">
        <div class="aulogo">🥗</div><h2>Fit Track</h2><p class="mu sm" style="margin:0 0 14px">Beslenme programın ve kalori takibin, tüm cihazlarında.</p>
        <input id="auEmail" type="email" placeholder="E-posta" autocomplete="username" autocapitalize="off">
        <input id="auPass" type="password" placeholder="Şifre" autocomplete="current-password" style="margin-top:10px">
        <div id="auErr" class="sm" style="color:var(--bad);min-height:20px;margin:8px 2px">${esc(msg || "")}</div>
        <button class="pri full" data-act="login">Giriş yap</button>
        <button class="full" data-act="signup" style="margin-top:8px">Hesap oluştur</button>
        <button class="ghost full" data-act="forgot" style="margin-top:4px">Şifremi unuttum</button>
      </div>`;
}
function hideAuth() { const el = $("#auth"); if (el) el.style.display = "none"; }
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "auPass") Cloud.auth("login"); });

/* ============ Başlat ============ */
Cloud.init();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && view === "today") { const t = ymd(new Date()); if (curDate !== t && !S.days[curDate]?.foods?.length) { curDate = t; } renderToday(); }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
