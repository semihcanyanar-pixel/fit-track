<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit Track">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-512.png">
<title>Fit Track</title>
<style>
/* ===== Tema: Taze & Ferah (varsayılan, açık) ===== */
:root{
  --bg:#f6f4ef;--card:#ffffff;--card2:#f3f0e8;--in:#f3f0e8;--ln:rgba(20,20,20,.07);
  --tx:#1a1c1e;--mu:#7a7f87;
  --ac:#10b981;--ac-d:#059669;--ac2:rgba(16,185,129,.12);--acTx:#047857;
  --g1:#10b981;--g2:#f59e0b;--btn:linear-gradient(135deg,#10b981,#059669);--btnSh:0 8px 20px rgba(16,185,129,.30);
  --warn:#e08a2c;--bad:#e5484d;--p:#3b82f6;--c:#f59e0b;--f:#ec4899;--w:#0ea5e9;
  --sh:0 2px 4px rgba(0,0,0,.03),0 12px 28px rgba(60,50,20,.08);
  --navbg:rgba(255,255,255,.88);--glass:none;
  --hero:radial-gradient(110% 55% at 100% -10%,rgba(255,154,61,.20),transparent 60%),radial-gradient(90% 50% at 0% 0%,rgba(16,185,129,.16),transparent 60%);
  --tint-y:rgba(245,158,11,.14);--tint-g:rgba(16,185,129,.13);--tint-p:rgba(236,72,153,.12);--tint-b:rgba(59,130,246,.12);--tint-v:rgba(139,92,246,.12);--tint-c:rgba(14,165,233,.13);
  color-scheme:light;
}
/* ===== Tema: Aurora (koyu, elle seçilir) ===== */
:root[data-theme="dark"]{
  --bg:#0d0b1e;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.08);--in:rgba(255,255,255,.07);--ln:rgba(255,255,255,.10);
  --tx:#f5f3ff;--mu:#a5a1c4;
  --ac:#2dd4bf;--ac-d:#14b8a6;--ac2:rgba(45,212,191,.14);--acTx:#5eead4;
  --g1:#2dd4bf;--g2:#a78bfa;--btn:linear-gradient(135deg,#2dd4bf,#8b5cf6);--btnSh:0 8px 22px rgba(139,92,246,.35);
  --warn:#fbbf24;--bad:#fb7185;--p:#818cf8;--c:#fcd34d;--f:#f472b6;--w:#38bdf8;
  --sh:0 10px 30px rgba(0,0,0,.30);
  --navbg:rgba(30,25,60,.78);--glass:blur(20px);
  --hero:radial-gradient(100% 55% at 100% 0%,rgba(139,92,246,.42),transparent 60%),radial-gradient(90% 50% at 0% 10%,rgba(45,212,191,.26),transparent 60%);
  --tint-y:rgba(251,191,36,.16);--tint-g:rgba(45,212,191,.16);--tint-p:rgba(244,114,182,.16);--tint-b:rgba(129,140,248,.18);--tint-v:rgba(167,139,250,.18);--tint-c:rgba(56,189,248,.16);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:var(--hero);background-repeat:no-repeat;background-size:100% 460px;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:0 16px}
header.top{max-width:640px;margin:0 auto;padding:18px 18px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:28px;margin:0;letter-spacing:-.025em;line-height:1.15;font-weight:800}
header.top h1 small{display:block;font-size:13px;font-weight:600;color:var(--mu);letter-spacing:0;margin-top:3px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none;box-shadow:var(--btnSh);cursor:pointer}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:26px;padding:18px;margin:14px 0;box-shadow:var(--sh);border:1px solid var(--ln);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.card h3{margin:0 0 12px;font-size:17px;letter-spacing:-.01em;font-weight:800}
.card h4{margin:14px 0 6px;font-size:15px}
.sec{font-size:18px;font-weight:800;margin:22px 4px 10px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.sec small{font-size:13px;color:var(--mu);font-weight:600}
.mu{color:var(--mu)}.sm{font-size:13px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:16px;padding:12px 14px;background:var(--card2);color:var(--tx);font-weight:700;cursor:pointer}
button.pri{background:var(--btn);color:#fff;box-shadow:var(--btnSh)}
button.ghost{background:transparent;color:var(--acTx);padding:8px 10px;box-shadow:none}
button.dan{color:var(--bad)}
button.full{width:100%}
button:disabled{opacity:.45}
button.ic{padding:7px 12px;border-radius:13px;font-size:16px}
input,select,textarea{font:inherit;font-size:16px;width:100%;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px 13px;outline:none}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.85}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:74px}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;color:var(--mu);margin:0 0 5px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:8px 6px;font-size:13px;background:transparent;white-space:nowrap;border-radius:11px;box-shadow:none;color:var(--mu)}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.10);color:var(--tx)}
:root[data-theme="dark"] .seg button.on{background:rgba(255,255,255,.14)}
.seg.mini{display:inline-flex}.seg.mini button{padding:6px 12px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card2);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:none}
.chip small{color:var(--mu);font-weight:600}
.pillx{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pillx.ok{background:var(--ac2);color:var(--acTx)}.pillx.warn{background:var(--tint-y);color:var(--warn)}.pillx.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
/* nav */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;height:68px;background:var(--navbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.14)}
nav.tabs button{background:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mu);padding:6px 0;font-weight:700;border-radius:18px;box-shadow:none}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--acTx)}
nav.tabs button.plus{flex:none;width:58px;height:58px;border-radius:20px;margin:-30px 4px 0;background:var(--btn);color:#fff;box-shadow:var(--btnSh);justify-content:center;padding:0}
nav.tabs button.plus svg{width:28px;height:28px}
/* hafta şeridi */
.week{display:flex;align-items:center;gap:6px;margin:12px 0 2px}
.week .nav2{flex:none;width:28px;height:52px;padding:0;background:transparent;color:var(--mu);font-size:20px;box-shadow:none}
.week .days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{padding:7px 0 6px;border-radius:15px;text-align:center;font-size:11px;color:var(--mu);background:var(--card);border:1px solid var(--ln);font-weight:700;position:relative;box-shadow:none}
.wd b{display:block;font-size:16px;color:var(--tx);margin-top:1px}
.wd.on{background:var(--btn);color:#fff;border-color:transparent;box-shadow:var(--btnSh)}.wd.on b{color:#fff}
.wd.dot:after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.wd.on.dot:after{background:#fff}
.wd:disabled{opacity:.35}
.todaybtn{display:block;margin:6px auto 0;padding:5px 12px;font-size:12px;border-radius:99px;background:var(--ac2);color:var(--acTx)}
/* özet */
.sum{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:33px;font-weight:800;letter-spacing:-.035em;line-height:1}
.ring .ctr span{font-size:12px;color:var(--mu);font-weight:700;margin-top:4px}
.macs{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
.mac .r{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:6px}
.mac .r em{font-style:normal;color:var(--mu);font-weight:600;white-space:nowrap}
.bar{height:7px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px}
.kalan{margin-top:14px;display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:16px;padding:11px 14px;font-size:14px;font-weight:700}
.kalan b{font-size:15px}
.formula{font-size:12px;color:var(--mu);margin-top:6px;text-align:center}
.note{background:var(--ac2);border-radius:16px;padding:11px 13px;font-size:14px;margin-top:10px}
.warnbox{background:var(--tint-y);border-radius:16px;padding:11px 13px;font-size:14px;margin-top:10px}
/* öğün kartları */
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mealc{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:12px 4px 10px;text-align:center;font-size:12.5px;font-weight:800;box-shadow:var(--sh);color:var(--tx);display:flex;flex-direction:column;align-items:center;backdrop-filter:var(--glass)}
.mealc .e{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:6px}
.mealc small{display:block;color:var(--mu);font-weight:700;font-size:11px;margin-top:1px}
.mealc.on{background:var(--btn);color:#fff;border-color:transparent;box-shadow:var(--btnSh)}.mealc.on small{color:rgba(255,255,255,.85)}.mealc.on .e{background:rgba(255,255,255,.22)!important}
/* ekleme kartı */
.addh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.addh .e{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card2)}
.addh b{font-size:16px}
.ph{position:relative;margin-bottom:10px}
.ph img{width:100%;max-height:220px;object-fit:cover;border-radius:18px;display:block}
.ph button{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
.ph .tagp{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .camb{width:52px;flex:none;padding:0;font-size:20px}
/* listeler */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.item:first-child{border-top:0;padding-top:2px}
.fic{width:42px;height:42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .nm{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.item .nm small{display:block;color:var(--mu);font-size:12px;font-weight:600;margin-top:1px}
.kc{font-weight:800;white-space:nowrap;background:none;padding:4px 4px;box-shadow:none;font-size:14px;color:var(--tx)}
.del{background:none;color:var(--mu);padding:4px 6px;font-size:18px;box-shadow:none}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln);cursor:pointer;user-select:none}
.mrow:first-child{border-top:0;padding-top:2px}
.mrow b{font-size:15px}.mrow small{display:block;color:var(--mu);font-size:12px;font-weight:600}
.mrow .mk{font-size:14px;white-space:nowrap}.mrow .chev{color:var(--mu);font-size:20px;width:14px;text-align:center}
.mbody{margin:0 0 4px 50px}.mbody .item:first-child{padding-top:4px}
.mgrp{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--mu);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.mgrp:first-child{margin-top:0}
.prev .item input[type=number]{width:84px;padding:7px 9px;text-align:right}
.prev .item input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
/* su */
.wbar{height:12px;border-radius:9px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.wbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7dd3fc,var(--w))}
.glasses{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.glass{width:20px;height:26px;border:2px solid var(--w);border-top:0;border-radius:0 0 6px 6px;opacity:.35}
.glass.on{background:var(--w);opacity:.85}
.wq{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wq button{flex:1;padding:10px 6px;font-size:14px;background:var(--tint-c);color:var(--tx)}
/* değerlendirme */
.rv-head{display:flex;gap:14px;align-items:flex-start}
.score{flex:none;width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff}
ul.l{margin:6px 0;padding-left:20px}ul.l li{margin:4px 0}
.cut{background:var(--card2);border-radius:14px;padding:10px 12px;margin:6px 0}
/* program */
.big2{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1}
.unit{font-size:15px;color:var(--mu);font-weight:700;margin-left:4px}
.stack{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:14px 0 9px;gap:3px}
.leg{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;gap:6px;flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:5px}.leg i{width:8px;height:8px;border-radius:3px;display:inline-block}
.leg em{font-style:normal;color:var(--mu);font-weight:600}
.mini{display:flex;gap:12px;align-items:center;cursor:pointer}
.mini .ic2{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:2px;background:var(--card2);border-radius:2px}
.tli{position:relative;padding:10px 0;border-top:1px solid var(--ln)}
.tli:first-child{border-top:0;padding-top:2px}
.tli:before{content:"";position:absolute;left:-20px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--card)}
.tli:first-child:before{top:8px}
.tli .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:14.5px}
.tli .r em{font-style:normal;font-size:12px;color:var(--mu);font-weight:800;background:var(--card2);padding:3px 9px;border-radius:99px;white-space:nowrap}
.tli p{font-size:13.5px;color:var(--mu);margin:3px 0 0}
.tli .yedim{margin-top:8px;padding:6px 12px;font-size:12.5px;border-radius:99px;background:var(--ac2);color:var(--acTx)}
.tli .yedim.done{background:var(--card2);color:var(--mu)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:14px;margin-top:10px}
.kv span{color:var(--mu)}
/* kilo */
.prog2{height:10px;border-radius:9px;background:var(--card2);overflow:hidden;margin:14px 0 7px}.prog2 i{display:block;height:100%;background:var(--btn);border-radius:9px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stepper button{width:52px;height:52px;border-radius:17px;font-size:24px;padding:0}
.stepper .val{text-align:center;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.tiles div{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh);backdrop-filter:var(--glass)}
.tiles.in div{background:var(--card2);box-shadow:none;border:0}
.tiles b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}.tiles span{font-size:11px;color:var(--mu);font-weight:700}
svg.chart{width:100%;height:auto;display:block;margin-top:10px}
.dl{font-size:12px;font-weight:800;margin-left:8px}
/* profil */
.phead{text-align:center;padding-top:22px}
.phead .avatar{width:74px;height:74px;font-size:30px;margin:0 auto}
.phead .nm{font-size:21px;font-weight:800;margin-top:10px;letter-spacing:-.01em}
.grp{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--mu);text-transform:uppercase;margin:20px 6px 8px}
.lst{padding:6px 16px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);font-size:15px;font-weight:700;width:100%;background:none;border-radius:0;box-shadow:none;text-align:left;color:var(--tx)}
.lrow:first-child{border-top:0}
.lrow .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.lrow .v{margin-left:auto;color:var(--mu);font-weight:600;font-size:13px;text-align:right;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ch{color:var(--mu);font-size:20px;margin-left:2px;flex:none}
/* alt panel (sheet) */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fd .2s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1);max-width:640px;margin:0 auto}
:root[data-theme="dark"] #sheet .pn{background:#16132d}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 12px}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#sheet .sh b{font-size:19px}
#sheet .x{width:34px;height:34px;padding:0;border-radius:50%}
@keyframes up{from{transform:translateY(100%)}}@keyframes fd{from{opacity:0}}
/* genel */
.empty{text-align:center;padding:28px 12px}
.empty .e{font-size:46px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2420;color:#fff;padding:11px 16px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:45;color:#fff;gap:12px;padding:20px;text-align:center;white-space:pre-line;font-weight:600}
#busy.on{display:flex}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
#auth{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;padding:20px;background-color:var(--bg);background-image:var(--hero);background-repeat:no-repeat;background-size:100% 460px}

<script>
"use strict";
/* ============ Sabitler ============ */
const KEY = "fittrack_v1";
const DEFAULT_WORKER = "https://fit-track.semihcanyanar.workers.dev";
// Firebase yapılandırması (Project settings → Your apps → Web). null ise uygulama sadece cihazda çalışır.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDTzl2BT1boViRZm3gcOBAxFlPRTj-1dTs",
  authDomain: "fit-track-8b38d.firebaseapp.com",
  projectId: "fit-track-8b38d",
  storageBucket: "fit-track-8b38d.firebasestorage.app",
  messagingSenderId: "685218259700",
  appId: "1:685218259700:web:c52085e9dd9226448874a1"
};
const FB_VER = "10.12.2";
const MEALS = ["Kahvaltı", "Öğle", "Akşam", "Ara öğün"];
const ACT = {
  hareketsiz: [1.2, "Hareketsiz (çoğunlukla oturarak)"],
  az: [1.3, "Az hareketli (ev işi, kısa yürüyüş)"],
  orta: [1.45, "Orta (gün içinde çok ayakta / bebekle ilgilenme)"],
  cok: [1.6, "Çok hareketli (fiziksel iş)"]
};
const SPECIAL = {
  yok: "Yok",
  emzirme_tam: "Emziriyorum (sadece anne sütü)",
  emzirme_karma: "Emziriyorum (karma beslenme)",
  lohusa: "Doğum sonrası, emzirmiyorum",
  hamile: "Hamileyim"
};
const SPECIAL_ADD = { yok: 0, emzirme_tam: 500, emzirme_karma: 300, lohusa: 0, hamile: 300 };
const LEVELS = ["Yok / çok az", "Başlangıç", "Orta", "İleri", "Profesyonel / yarışmacı"];
const GOAL_EXAMPLES = [
  "Şu sıralar spor yapamıyorum. Kas kaybetmeden ve çok yağlanmadan bu 1 aylık süreci geçirmek istiyorum.",
  "Doğum yaptım, lohusayım. Hem sütüm artsın hem de kilo ve ödemi yavaş yavaş atmaya başlamak istiyorum.",
  "Haftada 4 gün ağırlık çalışıyorum, yağ oranımı düşürüp kas kütlemi korumak/artırmak istiyorum."
];
const SYS = `Sen Türkçe konuşan, kanıta dayalı çalışan deneyimli bir diyetisyen asistanısın. Türk mutfağını, ev yemeklerini ve Türkiye'deki standart porsiyonları çok iyi bilirsin.
Kurallar:
- Yanıtını SADECE istenen JSON şemasında ver, başka metin ekleme.
- Kişinin alerjisi/intoleransı olan besinleri ASLA önermezsin.
- Tıbbi teşhis koymazsın. Emzirme, hamilelik, kronik hastalık gibi durumlarda güvenli sınırlarda kalırsın; gerekirse doktor/diyetisyene danışmasını kısaca hatırlatırsın.
- Aşırı düşük kalori, öğün atlama, detoks/kür gibi uygulamaları önermezsin. Emzirenlerde haftada ~0,5 kg'dan hızlı kayıp hedeflemezsin.
- Samimi, net ve kısa yazarsın; "sen" diye hitap edersin.`;

/* ============ Durum ============ */
const defaults = () => ({ profile: null, settings: { workerUrl: DEFAULT_WORKER }, targets: null, plan: null, days: {}, weights: [], recent: [] });
let storeKey = KEY;          // giriş yapınca kullanıcıya özel anahtar olur
let S = FIREBASE_CONFIG ? defaults() : load();
let view = "today";
let curDate = ymd(new Date());
let planDay = 0;
let wRange = 90;
const draft = { food: "", meal: guessMeal(), preview: null, manual: false, ex: "", exManual: false };

function load(k = storeKey) {
  try { const s = JSON.parse(localStorage.getItem(k)); if (s) { const o = Object.assign(defaults(), s); if (!o.settings.workerUrl) o.settings.workerUrl = DEFAULT_WORKER; return o; } } catch (e) {}
  return defaults();
}
function save() {
  try { localStorage.setItem(storeKey, JSON.stringify(S)); } catch (e) { toast("Kaydedilemedi: depolama dolu olabilir", 1); }
  Cloud.schedule();
}

/* ============ Yardımcılar ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const arr = v => Array.isArray(v) ? v : [];
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const r1 = v => Math.round(num(v) * 10) / 10;
const fmt = n => Math.round(n).toLocaleString("tr-TR");
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(str, n) { const d = new Date(str + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
function trDate(str, opt) { return new Date(str + "T12:00:00").toLocaleDateString("tr-TR", opt || { weekday: "long", day: "numeric", month: "long" }); }
function guessMeal() { const h = new Date().getHours(); return h < 11 ? "Kahvaltı" : h < 15 ? "Öğle" : h < 18 ? "Ara öğün" : h < 22 ? "Akşam" : "Ara öğün"; }
function day(k) {
  if (!S.days[k]) S.days[k] = { foods: [], exercises: [], waterMl: 0 };
  const d = S.days[k]; d.foods ||= []; d.exercises ||= [];
  if (d.waterMl == null) { d.waterMl = (d.water || 0) * 250; delete d.water; }
  return d;
}
const GLASS = 250;
const waterUnit = () => S.settings.waterUnit === "litre" ? "litre" : "bardak";
const fmtL = ml => (ml / 1000).toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + " L";
function waterText(ml) { return waterUnit() === "litre" ? fmtL(ml) : `${r1(ml / GLASS).toLocaleString("tr-TR")} bardak`; }
const MEAL_EMOJI = { "Kahvaltı": "🍳", "Öğle": "🥗", "Akşam": "🍲", "Ara öğün": "🍎" };
function totals(d) {
  return d.foods.reduce((a, f) => ({ kcal: a.kcal + num(f.kcal), p: a.p + num(f.p), c: a.c + num(f.c), f: a.f + num(f.f) }), { kcal: 0, p: 0, c: 0, f: 0 });
}
function sortedWeights() { return [...S.weights].sort((a, b) => a.date.localeCompare(b.date)); }
function latestWeight() { const w = sortedWeights(); return w.length ? w[w.length - 1].kg : null; }

function baseline(p = S.profile) {
  if (!p) return null;
  const kg = num(latestWeight() || p.kilo), boy = num(p.boy), yas = num(p.yas);
  const bmr = 10 * kg + 6.25 * boy - 5 * yas + (p.cinsiyet === "erkek" ? 5 : -161);
  const extra = SPECIAL_ADD[p.ozel] || 0;
  const tdee = bmr * (ACT[p.aktivite]?.[0] || 1.3) + extra;
  const floor = String(p.ozel).startsWith("emzirme") ? 1800 : p.ozel === "hamile" ? 1900 : p.cinsiyet === "erkek" ? 1500 : 1200;
  return { kg, bmr: Math.round(bmr), tdee: Math.round(tdee), extra, floor, bmi: kg / Math.pow(boy / 100, 2) };
}
function dayTarget(date) {
  const b = baseline();
  const base = S.targets?.kcal || b?.tdee || 2000;
  const ex = (S.days[date]?.exercises || []).reduce((a, e) => a + num(e.kcal), 0);
  return { base, ex, total: base + ex };
}

/* ---- Uyarlamalı hedef: kayıtlara göre gerçek harcamayı tahmin et ---- */
function linSlope(pts) { // pts: [{x: gün, y: kg}] → kg/gün
  const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
  let nu = 0, de = 0; pts.forEach(p => { nu += (p.x - mx) * (p.y - my); de += (p.x - mx) ** 2; });
  return de ? nu / de : 0;
}
function adaptive() {
  if (!S.profile || !S.targets) return null;
  const b = baseline(), tg = S.targets, today = ymd(new Date());
  const WIN = 21, from = addDays(today, -WIN);
  // "Günü bitir" denmiş ya da 800 kcal üstü kayıtlı günler (yarım günler ortalamayı bozmasın)
  const days = [];
  for (let i = 1; i <= WIN; i++) {
    const k = addDays(today, -i), d = S.days[k];
    if (!d?.foods?.length) continue;
    const kc = totals(d).kcal;
    if (d.closed || kc >= 800) days.push({ k, kc, t: dayTarget(k), ex: d.exercises.reduce((a, e) => a + num(e.kcal), 0) });
  }
  const ws = sortedWeights().filter(w => w.date >= from);
  const span = ws.length >= 2 ? (new Date(ws[ws.length - 1].date) - new Date(ws[0].date)) / 864e5 : 0;
  const nDays = days.length, nW = ws.length;
  // Güven puanı (0-1): kayıt günü, tartı sayısı ve tartı aralığı arttıkça yükselir
  const score = Math.min(1, Math.min(nDays / 14, 1) * .5 + Math.min(nW / 5, 1) * .25 + Math.min(span / 14, 1) * .25);
  const conf = nDays >= 12 && nW >= 4 && span >= 12 ? "high" : nDays >= 7 && nW >= 3 && span >= 7 ? "mid" : nDays >= 3 && nW >= 2 && span >= 4 ? "low" : null;
  const res = { ready: !!conf, conf, score, nDays, nW, span: Math.round(span) };
  if (!conf) {
    const need = [];
    if (nDays < 3) need.push(`${3 - nDays} gün daha kayıt`);
    if (nW < 2) need.push(`${2 - nW} tartı daha`);
    else if (span < 4) need.push(`${Math.ceil(4 - span)} gün sonra bir tartı daha`);
    return { ...res, need: need.join(" ve ") || "biraz daha veri" };
  }

  const avgIn = days.reduce((a, d) => a + d.kc, 0) / nDays;
  const avgTarget = days.reduce((a, d) => a + d.t.total, 0) / nDays;
  const avgEx = days.reduce((a, d) => a + d.ex, 0) / nDays;
  // Günlük su/tuz dalgalanmasını yumuşatmak için tartıların hareketli ortalaması (EMA) üzerinden eğim
  let ema = ws[0].kg; const sm = ws.map((w, i) => (ema = i ? ema + .45 * (w.kg - ema) : ema, { date: w.date, kg: ema }));
  const t0 = new Date(sm[0].date).getTime();
  const slopeRaw = linSlope(ws.map(w => ({ x: (new Date(w.date) - t0) / 864e5, y: w.kg })));
  const slopeSm = linSlope(sm.map(w => ({ x: (new Date(w.date) - t0) / 864e5, y: w.kg })));
  const slopeDay = nW >= 4 ? slopeSm : (slopeRaw + slopeSm) / 2;
  const weekly = slopeDay * 7;
  const realTdee = avgIn - slopeDay * 7700;
  let goalWeekly = num(tg.haftalikHedefKg);
  const hk = num(S.profile.hedefKilo);
  if (!goalWeekly && hk && Math.abs(hk - b.kg) > 1) goalWeekly = hk < b.kg ? (String(S.profile.ozel).startsWith("emzirme") ? -0.4 : -0.5) : 0.25;
  const adherence = avgIn - avgTarget;
  const nursing = String(S.profile.ozel).startsWith("emzirme");
  const maxLoss = nursing ? -0.5 : -Math.max(0.5, b.kg * 0.01);
  const step = conf === "high" ? 250 : 100;           // güven arttıkça daha büyük ayar
  const f2 = v => (v > 0 ? "+" : "") + v.toFixed(2).replace(".", ",");

  let status, msg, suggest = null;
  const ideal = Math.round((realTdee - avgEx + goalWeekly * 7700 / 7) / 10) * 10;
  const clampStep = v => Math.max(tg.kcal - step, Math.min(tg.kcal + step, v));
  if (adherence > 150) {
    status = "uyum";
    msg = `Son ${nDays} günde hedefin günde ortalama ${fmt(adherence)} kcal üstünde yemişsin. Hedefi değiştirmeden önce mevcut hedefe uymayı dene; sonuç büyük ihtimalle bundan.`;
  } else if (weekly < maxLoss) {
    status = "hizli";
    msg = `Haftada ${Math.abs(weekly).toFixed(2).replace(".", ",")} kg veriyor görünüyorsun; bu ${nursing ? "emzirme döneminde" : "kas korumak için"} hızlı.` + (conf === "low" ? " Birkaç tartı daha bunu netleştirecek." : " Kaloriyi biraz artırmak daha güvenli.");
    if (conf !== "low") suggest = clampStep(Math.max(ideal, tg.kcal + 100));
  } else if (Math.abs(weekly - goalWeekly) <= 0.15) {
    status = "iyi";
    msg = `Hedeflenen hızda ilerliyorsun (haftada ${f2(weekly)} kg). Hedefi değiştirmeye gerek yok.`;
  } else {
    status = weekly > goalWeekly ? "yavas" : "fazla";
    if (conf === "low") msg = weekly > goalWeekly
      ? `Şu an haftada ${f2(weekly)} kg gidiyor görünüyorsun, hedef ${f2(goalWeekly)} kg. Henüz erken; birkaç gün daha kayıtla netleşince gerekirse ayar önereceğim.`
      : `Şu an beklenenden hızlı gidiyor görünüyorsun (haftada ${f2(weekly)} kg). Henüz erken; birkaç gün daha kayıtla netleşecek.`;
    else {
      suggest = clampStep(ideal);
      msg = weekly > goalWeekly
        ? `Hedef haftada ${f2(goalWeekly)} kg iken gerçekleşen ${f2(weekly)} kg. Gerçek harcaman tahminden düşük görünüyor; kaloriyi biraz azaltmak gerekiyor.`
        : `Beklenenden hızlı ilerliyorsun (haftada ${f2(weekly)} kg, hedef ${f2(goalWeekly)} kg). Kaloriyi biraz artırabilirsin.`;
    }
  }
  if (suggest != null) { suggest = Math.max(b.floor, Math.round(suggest / 10) * 10); if (Math.abs(suggest - tg.kcal) < 50) { suggest = null; if (status !== "hizli") status = "iyi"; } }
  return { ...res, avgIn, avgTarget, avgEx, weekly, realTdee, goalWeekly, adherence, status, msg, suggest, step };
}
function adaptiveText() {
  const a = adaptive();
  if (!a?.ready) return "Uyarlamalı analiz için yeterli veri yok.";
  return `(Güven: ${{ low: "düşük", mid: "orta", high: "yüksek" }[a.conf]}) Son ${a.nDays} günlük kayıt: ortalama alınan ${fmt(a.avgIn)} kcal; kilo değişimi haftada ${a.weekly.toFixed(2)} kg; kayıtlardan hesaplanan gerçek günlük harcama ≈ ${fmt(a.realTdee)} kcal (egzersiz dahil). Durum: ${a.msg}`;
}

/* ============ UI yardımcıları ============ */
let tt;
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : ""); clearTimeout(tt); tt = setTimeout(() => t.className = "", err ? 4200 : 2200); }
function busy(msg) { $("#busy").className = msg ? "on" : ""; $("#busyTx").textContent = msg || ""; $("#busyCancel").style.display = "none"; if (msg) setTimeout(() => { if ($("#busy").className === "on" && aiCtl) $("#busyCancel").style.display = ""; }, 5000); }
document.addEventListener("click", e => { if (e.target.id === "busyCancel" && aiCtl) aiCtl.abort("user"); });

function go(v) {
  view = v; applyTheme(); closeSheet();
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.go === v));
  const nm = (S.profile?.ad || "").trim().split(" ")[0];
  const greet = (() => { const hh = new Date().getHours(); return hh < 6 ? "İyi geceler" : hh < 12 ? "Günaydın" : hh < 18 ? "Merhaba" : "İyi akşamlar"; })();
  $("#ttl").innerHTML = v === "today" ? `${esc(greet)}${nm ? ", " + esc(nm) : ""}<small>${S.profile ? "Bugün de hedefine bir adım daha 💪" : "Fit Track'e hoş geldin"}</small>` : { plan: "Programın", weight: "Kilo", profile: S.profile ? "Profil" : "Seni tanıyalım" }[v];
  render();
  window.scrollTo(0, 0);
}
function render() { applyTheme(); ({ today: renderToday, plan: renderPlan, weight: renderWeight, profile: renderProfile })[view](); }

/* ============ Yapay zeka ============ */
let aiCtl = null;
async function ai(system, prompt, temperature = 0.4, mode = "fast", image = null) {
  const url = (S.settings.workerUrl || DEFAULT_WORKER).trim();
  const label = $("#busyTx").textContent;
  const t0 = Date.now();
  const tick = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); if (s >= 4) $("#busyTx").textContent = `${label} ${s} sn`; }, 1000);
  aiCtl = new AbortController();
  const hardStop = setTimeout(() => aiCtl.abort(), mode === "deep" ? 80000 : 30000);
  try {
    for (let i = 0; i < 2; i++) {               // yoğunlukta sadece 1 kez daha dene
      let r, d;
      try {
        r = await fetch(url, { method: "POST", signal: aiCtl.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system, prompt, temperature, mode, image: image || undefined }) });
        d = await r.json().catch(() => ({}));
      } catch (e) {
        if (aiCtl?.signal.aborted) throw new Error(aiCtl.signal.reason === "user" ? "İptal edildi." : "Yapay zeka çok geç yanıt verdi.");
        throw new Error("Bağlantı kurulamadı. İnternetini kontrol et.");
      }
      if (r.ok && !d.error) return parseJSON(d.text);
      if (d.detail) console.warn("AI:", d.detail);
      if (d.kind === "busy" && i === 0 && Date.now() - t0 < (mode === "deep" ? 30000 : 8000)) { await new Promise(res => setTimeout(res, 1500)); continue; }
      throw new Error(d.error || "Hata: " + r.status);
    }
  } catch (e) {
    throw new Error(e.message + (e.message === "İptal edildi." ? "" : " Yazdığın metin silinmedi; tekrar dene ya da 'Elle gir'i kullan."));
  } finally { clearInterval(tick); clearTimeout(hardStop); aiCtl = null; }
}
function parseJSON(t) {
  t = String(t || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  try { return JSON.parse(t); } catch (e) {
    const m = t.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
    throw new Error("Yapay zeka yanıtı okunamadı, tekrar dene.");
  }
}
function profileText() {
  const p = S.profile, b = baseline();
  const spor = num(p.sporSiklik) > 0
    ? `haftada ${p.sporSiklik} gün, ${p.sporSiddet} şiddette${p.sporTur ? " (" + p.sporTur + ")" : ""}`
    : "şu an spor yapmıyor / yapamıyor";
  return [
    `Ad: ${p.ad || "-"}`, `Cinsiyet: ${p.cinsiyet}`, `Yaş: ${p.yas}`, `Boy: ${p.boy} cm`, `Güncel kilo: ${b.kg} kg`,
    p.hedefKilo ? `Hedef kilo: ${p.hedefKilo} kg` : "",
    `Spor hariç günlük hareket: ${ACT[p.aktivite]?.[1]}`,
    `Spor geçmişi: ${p.sporSeviye}${p.sporGecmis ? " – " + p.sporGecmis : ""}`,
    `Bu dönemki spor planı: ${spor}`,
    `Özel durum: ${SPECIAL[p.ozel] || "Yok"}`,
    `AMAÇ: ${p.amac}`, p.sure ? `Süre: ${p.sure}` : "",
    `Alerji / intolerans: ${p.alerji || "yok"}`,
    `Sevmedikleri / yemedikleri: ${p.sevmedik || "-"}`,
    `Öğünlerde tercih ettiği besin ve yemekler: ${p.tercih || "-"}`,
    `Sağlık durumu / ilaç: ${p.saglik || "belirtilmedi"}`,
    `Tercih ettiği günlük öğün sayısı: ${p.ogunSayisi}`,
    `Hesaplanan: BMR ≈ ${b.bmr} kcal; spor hariç günlük harcama ≈ ${b.tdee} kcal${b.extra ? ` (özel durum için +${b.extra} kcal dahil)` : ""}; VKİ ≈ ${b.bmi.toFixed(1)}; güvenli alt sınır ${b.floor} kcal.`
  ].filter(Boolean).join("\n");
}
function exerciseSummary(n = 14) {
  let tot = 0, cnt = 0; const list = [];
  for (let i = 0; i < n; i++) {
    const k = addDays(ymd(new Date()), -i), d = S.days[k];
    if (d?.exercises?.length) { cnt++; d.exercises.forEach(e => { tot += num(e.kcal); if (list.length < 8) list.push(`${k}: ${e.desc} (${e.kcal} kcal)`); }); }
  }
  return cnt ? `Son ${n} günde ${cnt} gün egzersiz kaydı var, toplam ${fmt(tot)} kcal. ${list.join("; ")}` : `Son ${n} günde kayıtlı egzersiz yok.`;
}
function recentDaysSummary(fromDate, n = 7) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    const k = addDays(fromDate, -i), d = S.days[k];
    if (d?.foods?.length) { const t = dayTarget(k); out.push(`${k}: ${fmt(totals(d).kcal)} / ${fmt(t.total)} kcal`); }
  }
  return out.length ? out.join("; ") : "Önceki günlere ait kayıt yok.";
}

async function makePlan(fixedKcal) {
  if (typeof fixedKcal !== "number") fixedKcal = null;
  if (!S.profile) { go("profile"); return toast("Önce profilini doldur", 1); }
  busy("Programın hazırlanıyor…\n(20-40 sn sürebilir)");
  try {
    const prompt = `KİŞİ BİLGİLERİ:
${profileText()}

EGZERSİZ GEÇMİŞİ (uygulamaya girilen): ${exerciseSummary()}
KAYITLARA GÖRE GERÇEK DURUM: ${adaptiveText()}
${fixedKcal ? `ZORUNLU: Günlük kalori hedefi ${fixedKcal} kcal olarak belirlendi (kayıtlara göre ayarlandı). hedefKalori alanına tam olarak ${fixedKcal} yaz ve programı buna göre kur.` : ""}

GÖREV:
1) Kişinin amacına ve durumuna uygun GÜNLÜK KALORİ HEDEFİNİ belirle. Bu hedef egzersiz HARİÇ olmalı; spor günlerinde yakılan kalori uygulama tarafından hedefe ayrıca eklenecek.
2) Protein, karbonhidrat, yağ (gram) ve su (litre) hedeflerini belirle. Kas korumak/kazanmak amaçsa proteini yeterli tut.
3) Tavsiye niteliğinde, birbirinden farklı 3 örnek gün içeren bir beslenme programı hazırla. Her günde tercih edilen öğün sayısı kadar öğün olsun, içerikler porsiyonlarıyla (gram/adet/kaşık) yazılsın, öğün kalorileri ve gün toplamı hedefe yakın olsun.
4) Kişinin tercih ettiği yemekler amaca uygunsa programa dahil et; uygun değilse daha uygun bir versiyonunu kullan (ipuçlarında belirt).
5) Spor yapılan günlerde nasıl beslenmesi gerektiğini kısaca açıkla.

JSON ŞEMASI:
{"hedefKalori":number,"hedefYon":"ver|koru|al","haftalikHedefKg":number (haftalık hedef kilo değişimi; kayıp için negatif, ör. -0.5; korumada 0),"protein":number,"karbonhidrat":number,"yag":number,"suLitre":number,
"ozet":"2-3 cümlelik strateji","haftalikBeklenti":"gerçekçi haftalık/aylık beklenti","sporGunuNotu":"spor günü beslenmesi",
"onemliNotlar":["..."],
"gunler":[{"ad":"1. Gün","ogunler":[{"ogun":"Kahvaltı","icerik":"porsiyonlarıyla","kcal":number}],"toplamKcal":number}],
"ipuclari":["..."],"uyari":"gerekliyse kısa sağlık uyarısı, yoksa boş string"}`;
    const r = await ai(SYS, prompt, 0.6, "deep");
    const b = baseline();
    let kcal = fixedKcal || Math.round(num(r.hedefKalori) || b.tdee), raised = false;
    if (kcal < b.floor) { kcal = b.floor; raised = true; }
    S.targets = {
      kcal, protein: Math.round(num(r.protein)), carb: Math.round(num(r.karbonhidrat)), fat: Math.round(num(r.yag)),
      water: num(r.suLitre) || 2.5, ozet: r.ozet || "", haftalik: r.haftalikBeklenti || "", sporNot: r.sporGunuNotu || "",
      notlar: arr(r.onemliNotlar),
      uyari: [r.uyari, raised ? `Hedef, güvenli alt sınır olan ${b.floor} kcal'ye yükseltildi.` : ""].filter(Boolean).join(" "),
      at: Date.now(), kg: b.kg,
      yon: r.hedefYon || "", haftalikHedefKg: isFinite(+r.haftalikHedefKg) ? +r.haftalikHedefKg : 0,
      history: S.targets?.history || []
    };
    S.plan = { gunler: arr(r.gunler), ipuclari: arr(r.ipuclari), at: Date.now() };
    planDay = 0; save(); toast("Programın hazır"); go("plan");
  } catch (e) { toast(e.message, 1); } finally { busy(); }
}

function addFoods(items, meal) {
  if (typeof openMeals !== "undefined") openMeals.add(meal);
  const d = day(curDate);
  items.forEach(i => {
    const f = { id: uid(), meal, name: i.name, amount: i.amount || "", kcal: Math.round(num(i.kcal)), p: r1(i.p), c: r1(i.c), f: r1(i.f) };
    d.foods.push(f);
    S.recent = [{ name: f.name, amount: f.amount, kcal: f.kcal, p: f.p, c: f.c, f: f.f },
      ...S.recent.filter(x => !(x.name.toLowerCase() === f.name.toLowerCase() && x.amount === f.amount))].slice(0, 30);
  });
  save();
}

      <div class="btns"><button class="pri grow" data-act="confirmPrev">Öğüne ekle</button><button data-act="cancelPrev">Vazgeç</button></div></div>`;
  }

  // Yenenler
  const anyFood = d.foods.length;
  h += `<div class="sec">${isToday ? "Bugün yediklerin" : "Yenenler"}${anyFood ? `<small>${fmt(tot.kcal)} kcal</small>` : ""}</div><div class="card">${anyFood ? MEALS.map(m => {
    const fs = d.foods.filter(f => f.meal === m); if (!fs.length) return "";
    const open = openMeals.has(m);
    return `<div class="mrow" data-act="mtog" data-m="${m}" role="button" aria-expanded="${open}">
        <span class="fic" style="background:${MEAL_TINT[m]};width:38px;height:38px;font-size:18px">${MEAL_EMOJI[m]}</span>
        <span class="grow"><b>${m}</b><small>${fs.length} kalem</small></span>
        <b class="mk">${fmt(fs.reduce((a, f) => a + num(f.kcal), 0))} kcal</b><span class="chev">${open ? "⌃" : "›"}</span></div>
      ${open ? `<div class="mbody">${fs.map(f => `<div class="item"><div class="fic">${foodEmoji(f.name)}</div><div class="nm">${esc(f.name)}${f.amount ? `<small>${esc(f.amount)}</small>` : ""}</div>
        <button class="kc" data-act="editFood" data-id="${f.id}">${f.kcal} kcal</button><button class="del" data-act="delFood" data-id="${f.id}" aria-label="Sil">×</button></div>`).join("")}</div>` : ""}`;
  }).join("") : `<p class="mu sm" style="margin:0">Henüz bir şey girilmedi. Yukarıdan bir öğün seç.</p>`}</div>`;

  // Su
  const glasses = Math.round(d.waterMl / GLASS), gGoal = Math.round(waterGoal / GLASS);
  h += `<div class="card"><div class="row sp"><h3 style="margin:0">💧 Su</h3>
      <div class="seg mini"><button data-act="wunit" data-u="bardak" class="${unit === "bardak" ? "on" : ""}">Bardak</button><button data-act="wunit" data-u="litre" class="${unit === "litre" ? "on" : ""}">Litre</button></div></div>
    <div class="row sp" style="margin-top:12px"><b style="font-size:22px;letter-spacing:-.02em">${waterText(d.waterMl)}</b><span class="mu sm">hedef ${waterText(waterGoal)}</span></div>
    <div class="wbar"><i style="width:${Math.min(d.waterMl / waterGoal * 100, 100)}%"></i></div>
    ${unit === "bardak" ? `
      <div class="glasses">${Array.from({ length: Math.max(gGoal, glasses) }, (_, i) => `<div class="glass ${i < glasses ? "on" : ""}"></div>`).join("")}</div>
      <div class="wq"><button data-act="water" data-ml="-250">− 1 bardak</button><button data-act="water" data-ml="250">+ 1 bardak</button></div>
      <div class="hint">1 bardak = 250 ml</div>`
    : `
      <div class="wq"><button data-act="water" data-ml="250">+0,25 L</button><button data-act="water" data-ml="500">+0,5 L</button><button data-act="water" data-ml="1000">+1 L</button><button data-act="water" data-ml="-250">−0,25 L</button></div>
      <div class="row" style="margin-top:10px"><input id="wL" type="number" inputmode="decimal" step="0.1" placeholder="Toplam litre (ör. 1,8)" class="grow"><button data-act="setWater">Ayarla</button></div>`}
  </div>`;

  // Egzersiz
  h += `<div class="card"><h3>🏋️ Spor / antrenman</h3>
    ${d.exercises.map(e => `<div class="item"><div class="fic" style="background:var(--tint-y)">🔥</div><div class="nm">${esc(e.desc)}${e.ozet ? `<small>${esc(e.ozet)}</small>` : ""}</div>
      <span class="kc">−${e.kcal}</span><button class="del" data-act="delEx" data-id="${e.id}" aria-label="Sil">×</button></div>`).join("")}
    ${draft.exManual ? `
      <div class="row" style="margin-top:10px"><input id="exName" placeholder="ör. Koşu" class="grow"><input id="exKcal" type="number" inputmode="numeric" placeholder="kcal" style="width:92px"></div>
      <div class="btns"><button class="pri grow" data-act="addExManual">Ekle</button><button data-act="toggleEx">Tarif et</button></div>`
    : `<textarea data-draft="ex" rows="2" placeholder="ör. 10 dk ısınma, 4x10 squat 60 kg, 20 dk yürüyüş bandı" style="${d.exercises.length ? "margin-top:10px" : ""}">${esc(draft.ex)}</textarea>
      <div class="btns"><button class="pri grow" data-act="calcEx">✨ Yakılan kaloriyi hesapla</button><button data-act="toggleEx">Kcal gir</button></div>`}
    <div class="hint">Yakılan kalori bugünkü hedefine eklenir ve program hazırlanırken dikkate alınır.</div>
  </div>`;

  const rv = d.review;
  if (rv) h += reviewCard(rv, d);
  else h += `<div class="card"><h3>🌙 Gün sonu</h3><p class="mu sm" style="margin-top:0">Bugün başka bir şey yemeyeceksen günü bitir; toplamı hesaplayıp hedefine göre değerlendireyim, fazlalık varsa neleri çıkarman gerektiğini söyleyeyim.</p>
    <button class="pri full" data-act="review" ${anyFood ? "" : "disabled"}>Günü bitir ve değerlendir</button></div>`;

  el.innerHTML = h;
}

function reviewCard(rv, d) {
  const sc = Math.max(1, Math.min(10, Math.round(num(rv.puan) || 5)));
  const scBg = sc >= 8 ? "var(--btn)" : sc >= 5 ? "linear-gradient(135deg,#f59e0b,#f97316)" : "linear-gradient(135deg,#f43f5e,#e11d48)";
  const stale = rv.sig !== daySig(d);
  const cuts = arr(rv.cikarilacaklar);
  const li = a => arr(a).length ? `<ul class="l">${arr(a).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="card" id="review">
    <div class="rv-head"><div class="score" style="background:${scBg}">${sc}</div>
      <div class="grow"><b style="font-size:16px">${esc(rv.baslik || "Günün değerlendirmesi")}</b><p style="margin:4px 0 0">${esc(rv.ozet || "")}</p></div></div>
    ${stale ? `<div class="warnbox">Değerlendirmeden sonra kayıtlar değişti. Güncel hâli için yeniden değerlendir.</div>` : ""}
    ${num(rv.fazlaKalori) > 0 && cuts.length ? `<h4>≈ ${fmt(num(rv.fazlaKalori))} kcal fazlayı dengelemek için</h4>
      ${cuts.map(c => `<div class="cut"><div class="row sp"><b>${esc(c.besin)}</b><span class="b" style="color:var(--bad)">−${fmt(num(c.kcal))} kcal</span></div>
        <div class="sm mu">${esc(c.neden || "")}</div>${c.yerine ? `<div class="sm" style="margin-top:4px">↪ Yerine: ${esc(c.yerine)}</div>` : ""}</div>`).join("")}` : ""}
    ${arr(rv.iyiler).length ? `<h4>👍 İyi gidenler</h4>${li(rv.iyiler)}` : ""}
    ${arr(rv.gelistirilecekler).length ? `<h4>🔧 Geliştirilecekler</h4>${li(rv.gelistirilecekler)}` : ""}
    ${arr(rv.eksikler).length ? `<h4>Eksik kalanlar</h4><div class="chips">${arr(rv.eksikler).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
    ${rv.yarinIcin ? `<div class="note"><b>Yarın için:</b> ${esc(rv.yarinIcin)}</div>` : ""}
    <div class="btns"><button class="grow" data-act="review">Yeniden değerlendir</button><button class="dan" data-act="clearReview">Kaldır</button></div>
  </div>`;
}

/* ============ PROGRAM ============ */
let adjOpen = false;
const openMeals = new Set();   // "Bugün yediklerin"de açık olan öğünler
function ogunToMeal(s) { const n = String(s || "").toLocaleLowerCase("tr-TR"); return n.includes("kahvalt") ? "Kahvaltı" : n.includes("öğle") || n.includes("ogle") ? "Öğle" : n.includes("akşam") || n.includes("aksam") ? "Akşam" : "Ara öğün"; }
function renderPlan() {
  const el = $("#v-plan");
  $("#hdr").innerHTML = S.targets ? `<button class="ghost" data-act="makeplan">↻ Yenile</button>` : "";
  if (!S.profile) {
    el.innerHTML = `<div class="card empty"><div class="e">📋</div><p class="mu">Program için önce profilini doldur.</p><button class="pri full" data-go="profile">Profile git</button></div>`;
    return;
  }
  const tg = S.targets, pl = S.plan, b = baseline();
  if (!tg || !pl) {
    el.innerHTML = `<div class="card empty"><div class="e">✨</div><h3>Sana özel program</h3>
      <p class="mu">Bilgilerin ve amacına göre günlük kalori hedefini ve 3 günlük örnek beslenme programını hazırlayayım.</p>
      <p class="sm mu">Hesaplanan bakım kalorin (spor hariç): <b>${fmt(b.tdee)} kcal</b></p>
      <button class="pri full" data-act="makeplan">Programımı oluştur</button></div>`;
    return;
  }
  const changed = Math.abs(b.kg - (tg.kg || b.kg)) >= 2 || (S.profile.updatedAt || 0) > tg.at;
  const g = arr(pl.gunler)[planDay] || arr(pl.gunler)[0];
  const pk = tg.protein * 4, ck = tg.carb * 4, fk = tg.fat * 9;
  const wk = num(tg.haftalikHedefKg);
  const a = adaptive();
  const today = day(ymd(new Date()));
  const eaten = new Set(today.foods.map(f => f.planKey).filter(Boolean));
  let mini;
  const CL = { low: "Ön tahmin", mid: "Orta güven", high: "Yüksek güven" };
  if (!a?.ready) mini = { ic: "📊", tint: "var(--tint-b)", t: "Haftalık kontrol", s: `Veri toplanıyor · ${a?.need || "biraz daha veri"}`, pill: "" };
  else if (a.suggest != null) mini = { ic: "📈", tint: "var(--tint-y)", t: "Haftalık kontrol", s: `Hedefin ${fmt(a.suggest)} kcal olması öneriliyor`, pill: `<span class="pillx warn">İncele</span>` };
  else if (a.conf === "low") mini = { ic: "🔎", tint: "var(--tint-b)", t: "Haftalık kontrol", s: a.status === "uyum" ? "Hedefin biraz üstünde gidiyorsun" : a.status === "iyi" ? "Şimdilik hedefle uyumlu görünüyor" : "İlk eğilim görünmeye başladı", pill: `<span class="pillx ok" style="background:var(--tint-b);color:var(--p)">${CL.low}</span>` };
  else mini = { ic: a.status === "uyum" ? "🎯" : "✅", tint: a.status === "uyum" ? "var(--tint-y)" : "var(--tint-g)", t: "Haftalık kontrol", s: a.status === "uyum" ? "Önce mevcut hedefe uymaya odaklan" : "Hedeflenen hızda ilerliyorsun", pill: `<span class="pillx ${a.status === "uyum" ? "warn" : "ok"}">${a.status === "uyum" ? "Uyum" : "İyi"}</span>` };

  el.innerHTML = `
  <div class="sub mu sm" style="margin:-2px 4px 0;font-weight:600">${esc((S.profile.amac || "").slice(0, 60))}${(S.profile.amac || "").length > 60 ? "…" : ""} · ${new Date(tg.at).toLocaleDateString("tr-TR", { day: "numeric", month: "long" })}</div>
  ${changed ? `<div class="warnbox">Profilin veya kilon program hazırlandıktan sonra değişti. <button class="ghost" data-act="makeplan">Programı güncelle</button></div>` : ""}
  <div class="card">
    <div class="row sp" style="align-items:flex-end"><div><div class="mu sm" style="font-weight:700;margin-bottom:6px">Günlük hedef</div><span class="big2">${fmt(tg.kcal)}</span><span class="unit">kcal</span></div>
      ${wk ? `<span class="pillx ${wk < 0 ? "ok" : "warn"}">${wk > 0 ? "+" : ""}${String(wk).replace(".", ",")} kg/hafta</span>` : ""}</div>
    <div class="stack"><i style="flex:${pk};background:var(--p)"></i><i style="flex:${ck};background:var(--c)"></i><i style="flex:${fk};background:var(--f)"></i></div>
    <div class="leg"><span><i style="background:var(--p)"></i>Protein <em>${tg.protein} g</em></span><span><i style="background:var(--c)"></i>Karb. <em>${tg.carb} g</em></span><span><i style="background:var(--f)"></i>Yağ <em>${tg.fat} g</em></span></div>
    <div class="tiles in"><div><b>${fmt(b.tdee)}</b><span>bakım kcal</span></div><div><b>${String(tg.water).replace(".", ",")} L</b><span>su</span></div><div><b>+spor</b><span>hedefe eklenir</span></div></div>
    ${tg.ozet ? `<p style="margin:14px 0 0">${esc(tg.ozet)}</p>` : ""}
    ${tg.haftalik ? `<div class="note"><b>Beklenti:</b> ${esc(tg.haftalik)}</div>` : ""}
    ${tg.uyari ? `<div class="warnbox">${esc(tg.uyari)}</div>` : ""}
  </div>
  <div class="card" style="padding:14px 16px">
    <div class="mini" data-act="toggleAdj"><div class="ic2" style="background:${mini.tint}">${mini.ic}</div>
      <div class="grow"><div style="font-weight:800;font-size:15px">${mini.t}</div><div class="mu sm" style="font-weight:600">${mini.s}</div></div>${mini.pill}<span class="mu" style="font-size:20px">${adjOpen ? "⌃" : "›"}</span></div>
    ${adjOpen ? adaptiveDetail(a) : ""}
  </div>

  <div class="sec">Örnek gün<small>${g ? fmt(num(g.toplamKcal) || arr(g.ogunler).reduce((s, o) => s + num(o.kcal), 0)) + " kcal" : ""}</small></div>
  <div class="seg">${arr(pl.gunler).map((x, i) => `<button data-act="pday" data-i="${i}" class="${i === planDay ? "on" : ""}">${esc(x.ad || (i + 1) + ". Gün")}</button>`).join("")}</div>
  ${g ? `<div class="card"><div class="tl">${arr(g.ogunler).map((o, oi) => { const key = `${planDay}-${oi}-${pl.at}`; const done = eaten.has(key); const m = ogunToMeal(o.ogun);
    return `<div class="tli"><div class="r"><span>${MEAL_EMOJI[m]} ${esc(o.ogun)}</span><em>${fmt(num(o.kcal))} kcal</em></div><p>${esc(o.icerik)}</p>
      <button class="yedim ${done ? "done" : ""}" data-act="ate" data-o="${oi}" ${done ? "disabled" : ""}>${done ? "✓ Bugüne eklendi" : "✓ Yedim, bugüne ekle"}</button></div>`; }).join("")}</div></div>` : ""}

  ${tg.sporNot ? `<div class="card"><h3>🏋️ Spor günlerinde</h3><p style="margin:0">${esc(tg.sporNot)}</p></div>` : ""}
  ${arr(tg.notlar).length ? `<div class="card"><h3>📌 Önemli notlar</h3><ul class="l">${arr(tg.notlar).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  ${arr(pl.ipuclari).length ? `<div class="card"><h3>💡 İpuçları</h3><ul class="l">${arr(pl.ipuclari).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  <p class="sm mu" style="text-align:center;margin:16px 8px">Bu program tavsiye niteliğindedir; sağlık sorunun varsa doktoruna veya diyetisyenine danış.</p>`;
}

function confBar(a) {
  const lv = a?.conf, lbl = { low: "Düşük", mid: "Orta", high: "Yüksek" }[lv] || "Henüz yok";
  const pct = Math.round((a?.score || 0) * 100);
  return `<div style="margin-top:14px"><div class="row sp sm" style="font-weight:700"><span>Tahmin güveni</span><span class="mu">${lbl}</span></div>
    <div class="bar" style="height:8px"><i style="width:${Math.max(pct, 4)}%;background:var(--btn)"></i></div></div>`;
}
const CONF_NOTE = `<div class="hint" style="margin-top:10px">ℹ️ Veri girişi arttıkça tahminler daha güvenilir ve net hâle gelir. Düzenli kayıt ve haftada 2-3 tartı en iyi sonucu verir.</div>`;
function adaptiveDetail(a) {
  const tg = S.targets;
  const hist = arr(tg.history).slice(-3).reverse();
  const histHtml = hist.length ? `<h4>Geçmiş ayarlamalar</h4>${hist.map(x => `<div class="item"><div class="nm">${esc(new Date(x.at).toLocaleDateString("tr-TR"))}</div><span class="mu">${fmt(x.from)} → <b>${fmt(x.to)}</b> kcal</span></div>`).join("")}` : "";
  if (!a?.ready) {
    return `<div style="margin-top:12px"><p class="sm" style="margin:0">Yediklerin ve kilon kaydedildikçe gerçek kalori harcamanı hesaplayıp gidişatını göstereceğim. İlk ön tahmin için <b>${esc(a?.need || "biraz daha veri")}</b> yeterli.</p>
      ${confBar(a)}${CONF_NOTE}${histHtml}</div>`;
  }
  const col = { iyi: "var(--acTx)", uyum: "var(--warn)", hizli: "var(--bad)", yavas: "var(--warn)", fazla: "var(--warn)" }[a.status];
  return `<div style="margin-top:12px">
    <p style="margin:0;color:${col};font-weight:700">${esc(a.msg)}</p>
    <div class="kv">
      <span>Ortalama alınan</span><b>${fmt(a.avgIn)} kcal</b>
      <span>Ortalama hedef</span><b>${fmt(a.avgTarget)} kcal</b>
      <span>Kilo eğilimi</span><b>${a.weekly > 0 ? "+" : ""}${a.weekly.toFixed(2).replace(".", ",")} kg/hafta</b>
      <span>Hedeflenen</span><b>${a.goalWeekly > 0 ? "+" : ""}${a.goalWeekly.toFixed(2).replace(".", ",")} kg/hafta</b>
      <span>Gerçek harcama (tahmini)</span><b>${a.conf === "low" ? "~" : ""}${fmt(a.realTdee)} kcal</b>
    </div>
    ${confBar(a)}
    ${a.conf === "low" ? `<div class="note" style="margin-top:12px">Bu bir <b>ön tahmin</b>. Kalori hedefin, tahmin netleşene kadar değiştirilmeyecek.</div>` : ""}
    ${a.suggest != null ? `<div class="note" style="margin-top:12px"><div class="row sp"><span style="font-weight:700">Önerilen yeni hedef</span><span><span style="font-size:24px;font-weight:800">${fmt(a.suggest)}</span> <small class="sm mu">kcal</small></span></div>
      <div class="sm mu">Şu anki: ${fmt(tg.kcal)} kcal · ${a.conf === "high" ? "Değişim bir seferde en fazla 250 kcal." : "Güven orta olduğu için küçük adım (en fazla 100 kcal)."}</div>
      <div class="btns"><button class="pri grow" data-act="applyAdj" data-v="${a.suggest}">Hedefi güncelle</button><button data-act="applyAdj" data-v="${a.suggest}" data-plan="1">+ Yeni program</button></div></div>` : ""}
    <div class="hint">Son ${a.nDays} günlük kayda ve ${a.nW} tartıya göre hesaplandı.${String(S.profile.ozel).startsWith("emzirme") || S.profile.ozel === "lohusa" ? " Doğum sonrası ödem atımı ilk haftalarda kiloyu olduğundan hızlı düşürebilir." : " Kısa vadeli su tutulması sonucu etkileyebilir."}</div>
    ${CONF_NOTE}${histHtml}</div>`;
}

/* ============ KİLO ============ */
let wStep = null, wDate = null;
function weeklyRate(ws) {
  const from = addDays(ymd(new Date()), -28), pts = ws.filter(w => w.date >= from);
  if (pts.length < 2) return null;
  const t0 = new Date(pts[0].date).getTime();
  const span = (new Date(pts[pts.length - 1].date) - t0) / 864e5; if (span < 5) return null;
  return linSlope(pts.map(w => ({ x: (new Date(w.date) - t0) / 864e5, y: w.kg }))) * 7;
}
function renderWeight() {
  const el = $("#v-weight");
  $("#hdr").innerHTML = "";
  const all = sortedWeights();
  const tgtKg = num(S.profile?.hedefKilo) || null;
  const last = all[all.length - 1], first = all[0];
  if (wStep == null) wStep = last?.kg || num(S.profile?.kilo) || 70;
  if (!wDate) wDate = ymd(new Date());
  let list = all; if (wRange) { const from = addDays(ymd(new Date()), -wRange); list = all.filter(w => w.date >= from); }
  const rate = weeklyRate(all);
  let h = "";
  if (last) {
    const back = all.filter(w => w.date >= addDays(ymd(new Date()), -28));
    const ref = back.length > 1 ? back[0] : all.length > 1 ? all[0] : null;
    const ch = ref ? last.kg - ref.kg : 0;
    const weeks = ref ? Math.max(1, Math.round((new Date(last.date) - new Date(ref.date)) / 6048e5)) : 0;
    const losing = tgtKg ? tgtKg < first.kg : true;
    const pct = tgtKg && first.kg !== tgtKg ? Math.max(0, Math.min(100, (first.kg - last.kg) / (first.kg - tgtKg) * 100)) : null;
    const good = ch === 0 ? "ok" : (ch < 0) === losing ? "ok" : "warn";
    h += `<div class="card">
      <div class="row sp" style="align-items:flex-start"><div><span class="big2">${last.kg.toLocaleString("tr-TR")}</span><span class="unit">kg</span>
        <div class="mu sm" style="font-weight:600;margin-top:6px">Son ölçüm · ${esc(trDate(last.date, { day: "numeric", month: "long" }))}</div></div>
        ${ref ? `<span class="pillx ${good}">${ch < 0 ? "▼" : ch > 0 ? "▲" : "•"} ${Math.abs(ch).toFixed(1).replace(".", ",")} kg · ${weeks} hf</span>` : ""}</div>
      ${pct != null ? `<div class="prog2"><i style="width:${pct}%"></i></div>
        <div class="leg"><em>Başlangıç ${first.kg.toLocaleString("tr-TR")}</em><em style="color:var(--acTx);font-weight:800">%${Math.round(pct)}</em><em>Hedef ${tgtKg.toLocaleString("tr-TR")}</em></div>` : ""}
      <div class="seg" style="margin-top:16px">${[[7, "1 Hf"], [30, "1 Ay"], [90, "3 Ay"], [0, "Tümü"]].map(([v, l]) => `<button data-act="wr" data-v="${v}" class="${wRange === v ? "on" : ""}">${l}</button>`).join("")}</div>
      ${chart(list, tgtKg)}
    </div>`;
  }
  h += `<div class="card">
    <div class="row sp"><b style="font-size:15px">${wDate === ymd(new Date()) ? "Bugünkü ölçüm" : "Ölçüm"}</b><input type="date" id="wDate" value="${wDate}" max="${ymd(new Date())}" style="width:auto;padding:6px 10px;font-size:14px"></div>
    <div class="stepper"><button data-act="wstep" data-n="-0.1" aria-label="Azalt">−</button>
      <div class="val" data-act="wtype"><span class="big2" style="font-size:40px">${wStep.toFixed(1).replace(".", ",")}</span><span class="unit">kg</span><div class="hint" style="margin-top:2px">Dokun, yaz</div></div>

function smoothPath(p) {
  if (p.length < 2) return "";
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function chart(list, target) {
  if (list.length < 2) return `<p class="mu sm" style="text-align:center;margin:18px 0 4px">Grafik için bu aralıkta en az 2 ölçüm gerekli.</p>`;
  const W = 340, H = 170, pl = 30, pr = 10, pt = 14, pb = 24;
  const xs = list.map(w => new Date(w.date + "T12:00:00").getTime()), ys = list.map(w => w.kg);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (target && target >= lo - 4 && target <= hi + 4) { lo = Math.min(lo, target); hi = Math.max(hi, target); }
  lo = Math.floor(lo - .5); hi = Math.ceil(hi + .5); if (hi - lo < 2) hi = lo + 2;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const X = t => pl + (x1 === x0 ? .5 : (t - x0) / (x1 - x0)) * (W - pl - pr), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const pts = list.map((w, i) => [X(xs[i]), Y(w.kg)]);
  const line = smoothPath(pts), lp = pts[pts.length - 1];
  const area = line + ` L${lp[0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z`;
  let grid = "";
  for (let i = 0; i <= 2; i++) { const v = lo + (hi - lo) * i / 2, y = Y(v); grid += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="10" font-weight="600" fill="var(--mu)">${Math.round(v)}</text>`; }
  const lbl = s => new Date(s + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  const tl = target && target >= lo && target <= hi ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--g2)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W - pr}" y="${Y(target) - 5}" text-anchor="end" font-size="10" font-weight="800" fill="var(--g2)">hedef ${String(target).replace(".", ",")}</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".32"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${tl}<path d="${area}" fill="url(#wg)"/><path d="${line}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${list.length <= 20 ? pts.slice(0, -1).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--ac)"/>`).join("") : ""}
    <circle cx="${lp[0]}" cy="${lp[1]}" r="6" fill="var(--bg)" stroke="var(--ac)" stroke-width="3"/>
    <text x="${pl}" y="${H - 6}" font-size="10" font-weight="600" fill="var(--mu)">${lbl(list[0].date)}</text>
    <text x="${W - pr}" y="${H - 6}" font-size="10" font-weight="600" fill="var(--mu)" text-anchor="end">${lbl(list[list.length - 1].date)}</text></svg>`;
}

async function pickPhoto(file) {
  if (!file) return;
  busy("Fotoğraf hazırlanıyor…");
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Fotoğraf açılamadı")); i.src = url; });
    const MAX = 1024, sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const dataUrl = cv.toDataURL("image/jpeg", 0.8);
    draft.photo = { url: dataUrl, mime: "image/jpeg", data: dataUrl.split(",")[1] };
    draft.manual = false; renderToday(); focusAdd();
  } catch (e) { toast(e.message || "Fotoğraf okunamadı", 1); } finally { busy(); }
}
