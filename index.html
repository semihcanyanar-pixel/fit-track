<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit Track">
<meta name="theme-color" content="#d9f2e3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-512.png">
<title>Fit Track</title>
<style>
:root{
  --bg:#eef7f1;--bg2:#f8fcf9;--card:#ffffff;--tx:#15241b;--mu:#6a7a70;--ln:#e3ede6;--in:#f2f8f4;
  --ac:#2fa36b;--ac-d:#1f8a57;--ac2:#e3f4ea;--sun:#f2c94c;--warn:#e08a2c;--bad:#dc4b4b;
  --p:#4f7cff;--c:#f2b93b;--f:#e0679a;--w:#3aa7e0;
  --sh:0 2px 6px rgba(31,94,60,.05),0 10px 30px rgba(31,94,60,.07);
  --hero:linear-gradient(160deg,#d9f2e3 0%,#eef8f1 55%,#f8fcf9 100%);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1410;--bg2:#0c1410;--card:#15201a;--tx:#e6f0ea;--mu:#8b9d92;--ln:#22322a;--in:#1c2a22;
  --ac:#3fc07e;--ac-d:#35a86d;--ac2:#1a3326;--warn:#eba155;--bad:#ef6a6a;--sh:none;
  --hero:linear-gradient(160deg,#143222 0%,#0f1d16 60%,#0c1410 100%);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--hero) no-repeat,var(--bg2);background-size:100% 340px,auto;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:0 16px}
header.top{max-width:640px;margin:0 auto;padding:16px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:28px;margin:0;letter-spacing:-.02em;line-height:1.15}
header.top h1 small{display:block;font-size:15px;font-weight:600;color:var(--ac-d);letter-spacing:0;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#8fd3a8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none;box-shadow:0 4px 12px rgba(47,163,107,.3);border:3px solid var(--card)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:24px;padding:18px;margin:14px 0;box-shadow:var(--sh);border:1px solid var(--ln)}
.card h3{margin:0 0 12px;font-size:18px;letter-spacing:-.01em}
.card h4{margin:14px 0 6px;font-size:15px}
.sec{font-size:19px;font-weight:700;margin:22px 2px 10px;letter-spacing:-.01em}
.mu{color:var(--mu)}.sm{font-size:13px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:14px;padding:11px 14px;background:var(--in);color:var(--tx);font-weight:600;cursor:pointer}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac-d));color:#fff;box-shadow:0 4px 12px rgba(47,163,107,.25)}
button.ghost{background:transparent;color:var(--ac-d);padding:8px 10px;box-shadow:none}
button.dan{color:var(--bad)}
button.full{width:100%}
button:disabled{opacity:.5}
button.ic{padding:6px 11px;border-radius:12px;font-size:16px}
input,select,textarea{font:inherit;font-size:16px;width:100%;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);background:var(--card)}
textarea{resize:vertical;min-height:74px}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;color:var(--mu);margin:0 0 5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--in);border-radius:14px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:8px 6px;font-size:14px;background:transparent;white-space:nowrap;border-radius:11px;box-shadow:none}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.1);color:var(--ac-d)}
.seg.mini{display:inline-flex}.seg.mini button{padding:5px 10px;font-size:13px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--ac2);color:var(--tx);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;box-shadow:none}
.chip small{color:var(--mu)}
/* nav */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:6px;z-index:10;box-shadow:0 8px 30px rgba(20,60,40,.14)}
nav.tabs button{background:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:7px 0;font-weight:600;border-radius:18px;box-shadow:none}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac-d))}
nav.tabs button.plus{flex:none;width:54px;height:54px;border-radius:50%;margin:-26px 4px 0;background:linear-gradient(135deg,var(--ac),var(--ac-d));color:#fff;box-shadow:0 6px 16px rgba(47,163,107,.45);border:4px solid var(--bg2);justify-content:center;padding:0}
nav.tabs button.plus svg{width:26px;height:26px}
/* date bar */
.datebar{display:flex;align-items:center;gap:6px;margin-top:6px}
.datebar .d{flex:1;text-align:center;font-weight:600;font-size:15px}
.datebar button{background:color-mix(in srgb,var(--card) 70%,transparent)}
/* progress */
.prog h3{text-align:center;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pgrid .side{display:flex;flex-direction:column;gap:22px}
.pgrid .side.r{text-align:right}
.mstat span{display:block;font-size:13px;color:var(--mu);font-weight:600}
.mstat b{font-size:18px;letter-spacing:-.01em}
.mstat .v{white-space:nowrap}
.mstat em{font-style:normal;font-size:11px;color:var(--mu);font-weight:500;margin-left:2px}
.mstat .bar{height:5px;margin-top:4px}
.ring{position:relative;width:168px;height:168px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr span{font-size:13px;color:var(--mu);font-weight:600}
.ring .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.remain{text-align:center;margin-top:10px;font-weight:600;font-size:15px}
.formula{font-size:12px;color:var(--mu);text-align:center;margin-top:2px}
.bar{height:7px;border-radius:9px;background:var(--in);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:9px}
/* meal cards */
.mcards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.mcards::-webkit-scrollbar{display:none}
.mcard{flex:1 0 84px;min-width:84px;background:linear-gradient(170deg,#e6f6ec,#cdeedb);border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--tx);box-shadow:none;border:2px solid transparent}
.mcard .em{font-size:30px;line-height:1.1}
.mcard small{font-size:11px;color:var(--mu);font-weight:600}
.mcard .add{margin-top:3px;background:#fff;color:var(--ac-d);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.mcard.on{border-color:var(--ac);background:linear-gradient(170deg,#d3f0de,#b3e4c6)}
@media (prefers-color-scheme:dark){.mcard{background:linear-gradient(170deg,#1b3426,#163022)}.mcard.on{background:linear-gradient(170deg,#21452f,#1b3a28)}.mcard .add{background:var(--card)}}
/* lists */
.meal h4{display:flex;justify-content:space-between;margin:14px 0 4px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.item:first-of-type{border-top:0}
.fic{width:40px;height:40px;border-radius:12px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .nm{flex:1;min-width:0;font-weight:600}
.item .nm small{display:block;color:var(--mu);font-size:12px;font-weight:500}
.kc{font-weight:700;white-space:nowrap;background:none;padding:4px 6px;box-shadow:none}
.del{background:none;color:var(--mu);padding:4px 8px;font-size:18px;box-shadow:none}
.prev .item input[type=number]{width:84px;padding:6px 8px;text-align:right}
.prev .item input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
/* water */
.wbar{height:12px;border-radius:9px;background:var(--in);overflow:hidden;margin:10px 0 6px}
.wbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7cc8ef,var(--w))}
.glasses{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.glass{width:20px;height:26px;border:2px solid var(--w);border-top:0;border-radius:0 0 6px 6px;opacity:.35}
.glass.on{background:var(--w);opacity:.85}
.wq{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wq button{flex:1;padding:9px 6px;font-size:14px;background:color-mix(in srgb,var(--w) 12%,var(--card));color:var(--tx)}
/* review */
.rv-head{display:flex;gap:14px;align-items:flex-start}
.score{flex:none;width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff}
ul.l{margin:6px 0;padding-left:20px}ul.l li{margin:4px 0}
.cut{background:var(--in);border-radius:14px;padding:10px 12px;margin:6px 0}
.note{background:var(--ac2);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:8px}
.warnbox{background:color-mix(in srgb,var(--warn) 15%,transparent);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:8px}
.badge{display:inline-block;background:var(--warn);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;vertical-align:middle}
/* plan */
.tgt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:8px}
.tgt div{background:var(--in);border-radius:14px;padding:8px 4px}
.tgt b{display:block;font-size:18px}
.tgt span{font-size:11px;color:var(--mu)}
.pm{padding:10px 0;border-top:1px solid var(--ln)}
.pm:first-child{border-top:0}
.adj .big2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;margin-top:8px}
.kv span{color:var(--mu)}
/* weight */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--in);border-radius:14px;padding:8px 4px}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--mu)}
svg.chart{width:100%;height:auto;display:block}
/* misc */
.empty{text-align:center;padding:26px 10px}
.empty .e{font-size:44px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2420;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:40;color:#fff;gap:12px;padding:20px;text-align:center;white-space:pre-line}
#busy.on{display:flex}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
#auth{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;padding:20px;background:var(--hero) no-repeat,var(--bg2);background-size:100% 420px,auto}
.aubox{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:26px 22px;box-shadow:var(--sh);border:1px solid var(--ln);text-align:center}
.aubox h2{margin:6px 0 4px;font-size:26px;letter-spacing:-.02em}
.aulogo{width:72px;height:72px;margin:0 auto;border-radius:22px;background:linear-gradient(135deg,var(--ac),#8fd3a8);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 20px rgba(47,163,107,.3)}
@media (max-width:370px){.ring{width:140px;height:140px}.ring .big{font-size:26px}.mstat b{font-size:16px}}
</style>
</head>
<body>
<header class="top"><h1 id="ttl">Bugün</h1><div id="hdr"></div></header>
<main>
  <section id="v-today" class="view"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-weight" class="view"></section>
  <section id="v-profile" class="view"></section>
</main>

<nav class="tabs">
  <button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Bugün</button>
  <button data-go="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/></svg>Program</button>
  <button class="plus" data-act="quickAdd" aria-label="Yemek ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Kilo</button>
  <button data-go="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</nav>
<div id="toast"></div>
<div id="busy"><div class="spin"></div><div id="busyTx"></div><button id="busyCancel" style="background:rgba(255,255,255,.18);color:#fff;margin-top:6px">Vazgeç</button></div>

<script>
"use strict";
/* ============ Sabitler ============ */
const KEY = "fittrack_v1";
const DEFAULT_WORKER = "https://fit-track.semihcanyanar.workers.dev";
// Firebase yapılandırması (Project settings → Your apps → Web). null ise uygulama sadece cihazda çalışır.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDTzl2BT1boViRZm3gcOBAxFlPRTj-1dTs",
  authDomain: "fit-track-8b38d.firebaseapp.com",
  projectId: "fit-track-8b38d",
  storageBucket: "fit-track-8b38d.firebasestorage.app",
  messagingSenderId: "685218259700",
  appId: "1:685218259700:web:c52085e9dd9226448874a1"
};
const FB_VER = "10.12.2";
const MEALS = ["Kahvaltı", "Öğle", "Akşam", "Ara öğün"];
const ACT = {
  hareketsiz: [1.2, "Hareketsiz (çoğunlukla oturarak)"],
  az: [1.3, "Az hareketli (ev işi, kısa yürüyüş)"],
  orta: [1.45, "Orta (gün içinde çok ayakta / bebekle ilgilenme)"],
  cok: [1.6, "Çok hareketli (fiziksel iş)"]
};
const SPECIAL = {
  yok: "Yok",
  emzirme_tam: "Emziriyorum (sadece anne sütü)",
  emzirme_karma: "Emziriyorum (karma beslenme)",
  lohusa: "Doğum sonrası, emzirmiyorum",
  hamile: "Hamileyim"
};
const SPECIAL_ADD = { yok: 0, emzirme_tam: 500, emzirme_karma: 300, lohusa: 0, hamile: 300 };
const LEVELS = ["Yok / çok az", "Başlangıç", "Orta", "İleri", "Profesyonel / yarışmacı"];
const GOAL_EXAMPLES = [
  "Şu sıralar spor yapamıyorum. Kas kaybetmeden ve çok yağlanmadan bu 1 aylık süreci geçirmek istiyorum.",
  "Doğum yaptım, lohusayım. Hem sütüm artsın hem de kilo ve ödemi yavaş yavaş atmaya başlamak istiyorum.",
  "Haftada 4 gün ağırlık çalışıyorum, yağ oranımı düşürüp kas kütlemi korumak/artırmak istiyorum."
];
const SYS = `Sen Türkçe konuşan, kanıta dayalı çalışan deneyimli bir diyetisyen asistanısın. Türk mutfağını, ev yemeklerini ve Türkiye'deki standart porsiyonları çok iyi bilirsin.
Kurallar:
- Yanıtını SADECE istenen JSON şemasında ver, başka metin ekleme.
- Kişinin alerjisi/intoleransı olan besinleri ASLA önermezsin.
- Tıbbi teşhis koymazsın. Emzirme, hamilelik, kronik hastalık gibi durumlarda güvenli sınırlarda kalırsın; gerekirse doktor/diyetisyene danışmasını kısaca hatırlatırsın.
- Aşırı düşük kalori, öğün atlama, detoks/kür gibi uygulamaları önermezsin. Emzirenlerde haftada ~0,5 kg'dan hızlı kayıp hedeflemezsin.
- Samimi, net ve kısa yazarsın; "sen" diye hitap edersin.`;

/* ============ Durum ============ */
const defaults = () => ({ profile: null, settings: { workerUrl: DEFAULT_WORKER }, targets: null, plan: null, days: {}, weights: [], recent: [] });
let storeKey = KEY;          // giriş yapınca kullanıcıya özel anahtar olur
let S = FIREBASE_CONFIG ? defaults() : load();
let view = "today";
let curDate = ymd(new Date());
let planDay = 0;
let wRange = 90;
const draft = { food: "", meal: guessMeal(), preview: null, manual: false, ex: "", exManual: false };

function load(k = storeKey) {
  try { const s = JSON.parse(localStorage.getItem(k)); if (s) { const o = Object.assign(defaults(), s); if (!o.settings.workerUrl) o.settings.workerUrl = DEFAULT_WORKER; return o; } } catch (e) {}
  return defaults();
}
function save() {
  try { localStorage.setItem(storeKey, JSON.stringify(S)); } catch (e) { toast("Kaydedilemedi: depolama dolu olabilir", 1); }
  Cloud.schedule();
}

/* ============ Yardımcılar ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const arr = v => Array.isArray(v) ? v : [];
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const r1 = v => Math.round(num(v) * 10) / 10;
const fmt = n => Math.round(n).toLocaleString("tr-TR");
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(str, n) { const d = new Date(str + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
function trDate(str, opt) { return new Date(str + "T12:00:00").toLocaleDateString("tr-TR", opt || { weekday: "long", day: "numeric", month: "long" }); }
function guessMeal() { const h = new Date().getHours(); return h < 11 ? "Kahvaltı" : h < 15 ? "Öğle" : h < 18 ? "Ara öğün" : h < 22 ? "Akşam" : "Ara öğün"; }
function day(k) {
  if (!S.days[k]) S.days[k] = { foods: [], exercises: [], waterMl: 0 };
  const d = S.days[k]; d.foods ||= []; d.exercises ||= [];
  if (d.waterMl == null) { d.waterMl = (d.water || 0) * 250; delete d.water; }
  return d;
}
const GLASS = 250;
const waterUnit = () => S.settings.waterUnit === "litre" ? "litre" : "bardak";
const fmtL = ml => (ml / 1000).toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + " L";
function waterText(ml) { return waterUnit() === "litre" ? fmtL(ml) : `${r1(ml / GLASS).toLocaleString("tr-TR")} bardak`; }
const MEAL_EMOJI = { "Kahvaltı": "🍳", "Öğle": "🥗", "Akşam": "🍲", "Ara öğün": "🍎" };
function totals(d) {
  return d.foods.reduce((a, f) => ({ kcal: a.kcal + num(f.kcal), p: a.p + num(f.p), c: a.c + num(f.c), f: a.f + num(f.f) }), { kcal: 0, p: 0, c: 0, f: 0 });
}
function sortedWeights() { return [...S.weights].sort((a, b) => a.date.localeCompare(b.date)); }
function latestWeight() { const w = sortedWeights(); return w.length ? w[w.length - 1].kg : null; }

function baseline(p = S.profile) {
  if (!p) return null;
  const kg = num(latestWeight() || p.kilo), boy = num(p.boy), yas = num(p.yas);
  const bmr = 10 * kg + 6.25 * boy - 5 * yas + (p.cinsiyet === "erkek" ? 5 : -161);
  const extra = SPECIAL_ADD[p.ozel] || 0;
  const tdee = bmr * (ACT[p.aktivite]?.[0] || 1.3) + extra;
  const floor = String(p.ozel).startsWith("emzirme") ? 1800 : p.ozel === "hamile" ? 1900 : p.cinsiyet === "erkek" ? 1500 : 1200;
  return { kg, bmr: Math.round(bmr), tdee: Math.round(tdee), extra, floor, bmi: kg / Math.pow(boy / 100, 2) };
}
function dayTarget(date) {
  const b = baseline();
  const base = S.targets?.kcal || b?.tdee || 2000;
  const ex = (S.days[date]?.exercises || []).reduce((a, e) => a + num(e.kcal), 0);
  return { base, ex, total: base + ex };
}

/* ---- Uyarlamalı hedef: kayıtlara göre gerçek harcamayı tahmin et ---- */
function linSlope(pts) { // pts: [{x: gün, y: kg}] → kg/gün
  const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
  let nu = 0, de = 0; pts.forEach(p => { nu += (p.x - mx) * (p.y - my); de += (p.x - mx) ** 2; });
  return de ? nu / de : 0;
}
function adaptive() {
  if (!S.profile || !S.targets) return null;
  const b = baseline(), tg = S.targets, today = ymd(new Date());
  const WIN = 21, from = addDays(today, -WIN);
  // Sadece "günü bitir" denmiş ya da 800 kcal üstü kayıtlı günleri say (yarım günler ortalamayı bozmasın)
  const days = [];
  for (let i = 1; i <= WIN; i++) {
    const k = addDays(today, -i), d = S.days[k];
    if (!d?.foods?.length) continue;
    const kc = totals(d).kcal;
    if (d.closed || kc >= 800) days.push({ k, kc, t: dayTarget(k), ex: d.exercises.reduce((a, e) => a + num(e.kcal), 0) });
  }
  const ws = sortedWeights().filter(w => w.date >= from);
  const span = ws.length >= 2 ? (new Date(ws[ws.length - 1].date) - new Date(ws[0].date)) / 864e5 : 0;
  const need = { days: 7, weights: 3, span: 10 };
  const ready = days.length >= need.days && ws.length >= need.weights && span >= need.span;
  const res = { ready, nDays: days.length, nW: ws.length, span: Math.round(span), need };
  if (!ready) return res;

  const avgIn = days.reduce((a, d) => a + d.kc, 0) / days.length;
  const avgTarget = days.reduce((a, d) => a + d.t.total, 0) / days.length;
  const avgEx = days.reduce((a, d) => a + d.ex, 0) / days.length;
  const t0 = new Date(ws[0].date).getTime();
  const slopeDay = linSlope(ws.map(w => ({ x: (new Date(w.date) - t0) / 864e5, y: w.kg })));
  const weekly = slopeDay * 7;                         // kg/hafta (gerçekleşen)
  const realTdee = avgIn - slopeDay * 7700;            // ortalama gerçek harcama (egzersiz dahil)
  let goalWeekly = num(tg.haftalikHedefKg);            // kg/hafta (hedef, kayıp negatif)
  const hk = num(S.profile.hedefKilo);
  if (!goalWeekly && hk && Math.abs(hk - b.kg) > 1) goalWeekly = hk < b.kg ? (String(S.profile.ozel).startsWith("emzirme") ? -0.4 : -0.5) : 0.25;
  const adherence = avgIn - avgTarget;                 // + ise hedefin üstünde yenmiş
  const nursing = String(S.profile.ozel).startsWith("emzirme");
  const maxLoss = nursing ? -0.5 : -Math.max(0.5, b.kg * 0.01);

  let status, msg, suggest = null;
  const ideal = Math.round((realTdee - avgEx + goalWeekly * 7700 / 7) / 10) * 10;
  const clampStep = v => Math.max(tg.kcal - 250, Math.min(tg.kcal + 250, v));
  if (adherence > 150) {
    status = "uyum";
    msg = `Son ${days.length} günde hedefin günde ortalama ${fmt(adherence)} kcal üstünde yemişsin. Hedefi değiştirmeden önce mevcut hedefe uymayı dene; sonuç büyük ihtimalle bundan.`;
  } else if (weekly < maxLoss) {
    status = "hizli";
    suggest = clampStep(Math.max(ideal, tg.kcal + 100));
    msg = `Haftada ${Math.abs(weekly).toFixed(2).replace(".", ",")} kg veriyorsun; bu ${nursing ? "emzirme döneminde" : "kas korumak için"} hızlı. Kaloriyi biraz artırmak daha güvenli.`;
  } else if (Math.abs(weekly - goalWeekly) <= 0.15) {
    status = "iyi";
    msg = `Hedeflenen hızda ilerliyorsun (haftada ${weekly > 0 ? "+" : ""}${weekly.toFixed(2).replace(".", ",")} kg). Hedefi değiştirmeye gerek yok.`;
  } else {
    status = weekly > goalWeekly ? "yavas" : "fazla";
    suggest = clampStep(ideal);
    msg = weekly > goalWeekly
      ? `Hedef haftada ${goalWeekly.toFixed(2).replace(".", ",")} kg iken gerçekleşen ${weekly > 0 ? "+" : ""}${weekly.toFixed(2).replace(".", ",")} kg. Gerçek harcaman tahminden düşük görünüyor; kaloriyi biraz azaltmak gerekiyor.`
      : `Beklenenden hızlı ilerliyorsun (haftada ${weekly.toFixed(2).replace(".", ",")} kg, hedef ${goalWeekly.toFixed(2).replace(".", ",")} kg). Kaloriyi biraz artırabilirsin.`;
  }
  if (suggest != null) { suggest = Math.max(b.floor, Math.round(suggest / 10) * 10); if (Math.abs(suggest - tg.kcal) < 50) { suggest = null; if (status !== "hizli") status = "iyi"; } }
  return { ...res, avgIn, avgTarget, avgEx, weekly, realTdee, goalWeekly, adherence, status, msg, suggest };
}
function adaptiveText() {
  const a = adaptive();
  if (!a?.ready) return "Uyarlamalı analiz için yeterli veri yok.";
  return `Son ${a.nDays} günlük kayıt: ortalama alınan ${fmt(a.avgIn)} kcal; kilo değişimi haftada ${a.weekly.toFixed(2)} kg; kayıtlardan hesaplanan gerçek günlük harcama ≈ ${fmt(a.realTdee)} kcal (egzersiz dahil). Durum: ${a.msg}`;
}

/* ============ Yapay zeka ============ */
let aiCtl = null;
async function ai(system, prompt, temperature = 0.4, mode = "fast") {
  const url = (S.settings.workerUrl || DEFAULT_WORKER).trim();
  const label = $("#busyTx").textContent;
  const t0 = Date.now();
  const tick = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); if (s >= 4) $("#busyTx").textContent = `${label} ${s} sn`; }, 1000);
  aiCtl = new AbortController();
  const hardStop = setTimeout(() => aiCtl.abort(), mode === "deep" ? 80000 : 30000);
  try {
    for (let i = 0; i < 2; i++) {               // yoğunlukta sadece 1 kez daha dene
      let r, d;
      try {
        r = await fetch(url, { method: "POST", signal: aiCtl.signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system, prompt, temperature, mode }) });
        d = await r.json().catch(() => ({}));
      } catch (e) {
        if (aiCtl?.signal.aborted) throw new Error(aiCtl.signal.reason === "user" ? "İptal edildi." : "Yapay zeka çok geç yanıt verdi.");
        throw new Error("Bağlantı kurulamadı. İnternetini kontrol et.");
      }
      if (r.ok && !d.error) return parseJSON(d.text);
      if (d.detail) console.warn("AI:", d.detail);
      if (d.kind === "busy" && i === 0 && Date.now() - t0 < (mode === "deep" ? 30000 : 8000)) { await new Promise(res => setTimeout(res, 1500)); continue; }
      throw new Error(d.error || "Hata: " + r.status);
    }
  } catch (e) {
    throw new Error(e.message + (e.message === "İptal edildi." ? "" : " Yazdığın metin silinmedi; tekrar dene ya da 'Elle gir'i kullan."));
  } finally { clearInterval(tick); clearTimeout(hardStop); aiCtl = null; }
}
function parseJSON(t) {
  t = String(t || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
  try { return JSON.parse(t); } catch (e) {
    const m = t.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
    throw new Error("Yapay zeka yanıtı okunamadı, tekrar dene.");
  }
}
function profileText() {
  const p = S.profile, b = baseline();
  const spor = num(p.sporSiklik) > 0
    ? `haftada ${p.sporSiklik} gün, ${p.sporSiddet} şiddette${p.sporTur ? " (" + p.sporTur + ")" : ""}`

  return [

    p.hedefKilo ? `Hedef kilo: ${p.hedefKilo} kg` : "",
    `Spor hariç günlük hareket: ${ACT[p.aktivite]?.[1]}`,

    `AMAÇ: ${p.amac}`, p.sure ? `Süre: ${p.sure}` : "",
    `Alerji / intolerans: ${p.alerji || "yok"}`,
    `Sevmedikleri / yemedikleri: ${p.sevmedik || "-"}`,
    `Öğünlerde tercih ettiği besin ve yemekler: ${p.tercih || "-"}`,
    `Sağlık durumu / ilaç: ${p.saglik || "belirtilmedi"}`,
    `Tercih ettiği günlük öğün sayısı: ${p.ogunSayisi}`,
    `Hesaplanan: BMR ≈ ${b.bmr} kcal; spor hariç günlük harcama ≈ ${b.tdee} kcal${b.extra ? ` (özel durum için +${b.extra} kcal dahil)` : ""}; VKİ ≈ ${b.bmi.toFixed(1)}; güvenli alt sınır ${b.floor} kcal.`
  ].filter(Boolean).join("\n");
}
function exerciseSummary(n = 14) {
  let tot = 0, cnt = 0; const list = [];
  for (let i = 0; i < n; i++) {
    const k = addDays(ymd(new Date()), -i), d = S.days[k];
    if (d?.exercises?.length) { cnt++; d.exercises.forEach(e => { tot += num(e.kcal); if (list.length < 8) list.push(`${k}: ${e.desc} (${e.kcal} kcal)`); }); }
  }
  return cnt ? `Son ${n} günde ${cnt} gün egzersiz kaydı var, toplam ${fmt(tot)} kcal. ${list.join("; ")}` : `Son ${n} günde kayıtlı egzersiz yok.`;
}
function recentDaysSummary(fromDate, n = 7) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    const k = addDays(fromDate, -i), d = S.days[k];
    if (d?.foods?.length) { const t = dayTarget(k); out.push(`${k}: ${fmt(totals(d).kcal)} / ${fmt(t.total)} kcal`); }
  }
  return out.length ? out.join("; ") : "Önceki günlere ait kayıt yok.";
}

async function makePlan(fixedKcal) {
  if (typeof fixedKcal !== "number") fixedKcal = null;
  if (!S.profile) { go("profile"); return toast("Önce profilini doldur", 1); }
  busy("Programın hazırlanıyor…\n(20-40 sn sürebilir)");
  try {
    const prompt = `KİŞİ BİLGİLERİ:
${profileText()}

EGZERSİZ GEÇMİŞİ (uygulamaya girilen): ${exerciseSummary()}
KAYITLARA GÖRE GERÇEK DURUM: ${adaptiveText()}
${fixedKcal ? `ZORUNLU: Günlük kalori hedefi ${fixedKcal} kcal olarak belirlendi (kayıtlara göre ayarlandı). hedefKalori alanına tam olarak ${fixedKcal} yaz ve programı buna göre kur.` : ""}

GÖREV:
1) Kişinin amacına ve durumuna uygun GÜNLÜK KALORİ HEDEFİNİ belirle. Bu hedef egzersiz HARİÇ olmalı; spor günlerinde yakılan kalori uygulama tarafından hedefe ayrıca eklenecek.
2) Protein, karbonhidrat, yağ (gram) ve su (litre) hedeflerini belirle. Kas korumak/kazanmak amaçsa proteini yeterli tut.
3) Tavsiye niteliğinde, birbirinden farklı 3 örnek gün içeren bir beslenme programı hazırla. Her günde tercih edilen öğün sayısı kadar öğün olsun, içerikler porsiyonlarıyla (gram/adet/kaşık) yazılsın, öğün kalorileri ve gün toplamı hedefe yakın olsun.
4) Kişinin tercih ettiği yemekler amaca uygunsa programa dahil et; uygun değilse daha uygun bir versiyonunu kullan (ipuçlarında belirt).
5) Spor yapılan günlerde nasıl beslenmesi gerektiğini kısaca açıkla.

JSON ŞEMASI:
{"hedefKalori":number,"hedefYon":"ver|koru|al","haftalikHedefKg":number (haftalık hedef kilo değişimi; kayıp için negatif, ör. -0.5; korumada 0),"protein":number,"karbonhidrat":number,"yag":number,"suLitre":number,
"ozet":"2-3 cümlelik strateji","haftalikBeklenti":"gerçekçi haftalık/aylık beklenti","sporGunuNotu":"spor günü beslenmesi",
"onemliNotlar":["..."],
"gunler":[{"ad":"1. Gün","ogunler":[{"ogun":"Kahvaltı","icerik":"porsiyonlarıyla","kcal":number}],"toplamKcal":number}],
"ipuclari":["..."],"uyari":"gerekliyse kısa sağlık uyarısı, yoksa boş string"}`;
    const r = await ai(SYS, prompt, 0.6, "deep");
    const b = baseline();
    let kcal = fixedKcal || Math.round(num(r.hedefKalori) || b.tdee), raised = false;
    if (kcal < b.floor) { kcal = b.floor; raised = true; }
    S.targets = {
      kcal, protein: Math.round(num(r.protein)), carb: Math.round(num(r.karbonhidrat)), fat: Math.round(num(r.yag)),
      water: num(r.suLitre) || 2.5, ozet: r.ozet || "", haftalik: r.haftalikBeklenti || "", sporNot: r.sporGunuNotu || "",
      notlar: arr(r.onemliNotlar),
      uyari: [r.uyari, raised ? `Hedef, güvenli alt sınır olan ${b.floor} kcal'ye yükseltildi.` : ""].filter(Boolean).join(" "),
      at: Date.now(), kg: b.kg,
      yon: r.hedefYon || "", haftalikHedefKg: isFinite(+r.haftalikHedefKg) ? +r.haftalikHedefKg : 0,
      history: S.targets?.history || []
    };
    S.plan = { gunler: arr(r.gunler), ipuclari: arr(r.ipuclari), at: Date.now() };
    planDay = 0; save(); toast("Programın hazır"); go("plan");
  } catch (e) { toast(e.message, 1); } finally { busy(); }
}

JSON: {"puan":1-10,"baslik":"kısa başlık","ozet":"2-3 cümle","fazlaKalori":number,"cikarilacaklar":[{"besin":"string","kcal":number,"neden":"string","yerine":"string"}],"iyiler":["..."],"gelistirilecekler":["..."],"eksikler":["ör. protein, lif, su"],"yarinIcin":"somut öneri"}`, 0.5, "deep");
    d.review = { ...r, at: Date.now(), sig: daySig(d) };
    d.closed = true; save(); renderToday();
    setTimeout(() => $("#review")?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  } catch (e) { toast(e.message, 1); } finally { busy(); }
}

/* ============ BUGÜN ============ */
function renderToday() {
  const el = $("#v-today");
  $("#hdr").innerHTML = S.profile ? `<div class="avatar" data-go="profile">${esc(((S.profile.ad || "").trim()[0] || "🙂").toLocaleUpperCase("tr-TR"))}</div>` : "";
  if (!S.profile) {
    el.innerHTML = `<div class="card empty"><div class="e">🥗</div><h3>Hoş geldin!</h3>
      <p class="mu">Önce kendini ve amacını tanıt. Sonra sana özel kalori hedefi ve beslenme programı hazırlayayım.</p>
      <button class="pri full" data-go="profile">Profilimi oluştur</button></div>`;
    return;
  }
  const d = day(curDate), t = dayTarget(curDate), tot = totals(d), tg = S.targets;
  const diff = t.total - tot.kcal, ratio = t.total ? tot.kcal / t.total : 0;
  const over = ratio > 1;
  const R = 70, C = 2 * Math.PI * R, dash = Math.min(ratio, 1) * C;
  const isToday = curDate === ymd(new Date());
  const waterGoal = Math.round((tg?.water || 2.5) * 1000);
  const ms = (lbl, v, goal, unit, col) => `<div class="mstat"><span>${lbl}</span><div class="v"><b>${v}</b><em>${goal ? "/" + goal + unit : unit}</em></div>
    <div class="bar"><i style="width:${goal ? Math.min(num(v) / goal * 100, 100) : 0}%;background:${col}"></i></div></div>`;
  const adv = adaptive();
  const unit = waterUnit();

  let h = `
  <div class="datebar">
    <button class="ic" data-act="day" data-n="-1">‹</button>
    <div class="d">${isToday ? "Bugün · " : ""}${esc(trDate(curDate))}</div>
    <button class="ic" data-act="day" data-n="1" ${isToday ? "disabled" : ""}>›</button>
    ${isToday ? "" : `<button class="ic" data-act="today">Bugün</button>`}
  </div>

  <div class="card prog">
    <h3>Günün özeti</h3>
    <div class="pgrid">
      <div class="side">${ms("Protein", fmt(tot.p), tg?.protein, " g", "var(--p)")}${ms("Yağ", fmt(tot.f), tg?.fat, " g", "var(--f)")}</div>
      <div class="ring">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${over ? "#f0a24a" : "#2fa36b"}"/><stop offset="1" stop-color="${over ? "#dc4b4b" : "#f2c94c"}"/></linearGradient></defs>
          <circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--in)" stroke-width="16"/>
          <circle cx="84" cy="84" r="${R}" fill="none" stroke="url(#rg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${dash} ${C}"/></svg>
        <div class="ctr"><span>Kalori</span><div class="big">${fmt(tot.kcal)}</div><span>/ ${fmt(t.total)} kcal</span></div>
      </div>
      <div class="side r">${ms("Karbonhidrat", fmt(tot.c), tg?.carb, " g", "var(--c)")}${ms("Su", (d.waterMl / 1000).toLocaleString("tr-TR", { maximumFractionDigits: 2 }), waterGoal / 1000, " L", "var(--w)")}</div>
    </div>
    <div class="remain" style="color:${diff >= 0 ? "var(--ac-d)" : "var(--bad)"}">${diff >= 0 ? "Kalan: " + fmt(diff) + " kcal" : fmt(-diff) + " kcal fazla"}</div>
    <div class="formula">Hedef ${fmt(t.base)}${t.ex ? ` + egzersiz ${fmt(t.ex)}` : ""}${!tg ? " (geçici)" : ""}</div>
    ${!tg ? `<div class="note">Kişisel hedefin henüz yok, şu an bakım kalorin gösteriliyor. <button class="ghost" data-act="makeplan">Program oluştur</button></div>` : ""}
    ${adv?.ready && adv.suggest != null && isToday ? `<div class="note">📈 Kayıtlarına göre hedefinin <b>${fmt(adv.suggest)} kcal</b> olması öneriliyor. <button class="ghost" data-go="plan">İncele</button></div>` : ""}
  </div>

  <div class="sec">Öğün ekle</div>
  <div class="mcards">${MEALS.map(m => {
    const k = d.foods.filter(f => f.meal === m).reduce((a, f) => a + num(f.kcal), 0);
    return `<button class="mcard ${draft.meal === m ? "on" : ""}" data-act="meal" data-m="${m}"><span class="em">${MEAL_EMOJI[m]}</span>${m}<small>${k ? fmt(k) + " kcal" : "—"}</small><span class="add">Ekle</span></button>`;
  }).join("")}</div>

  <div class="card" id="addcard">
    <h3>${MEAL_EMOJI[draft.meal]} ${esc(draft.meal)} için ne yedin?</h3>
    ${draft.manual ? `
      <div class="row"><input id="mName" placeholder="Besin adı (ör. Elma)" class="grow"><input id="mKcal" type="number" inputmode="numeric" placeholder="kcal" style="width:90px"></div>
      <div class="row" style="margin-top:10px"><button class="pri grow" data-act="addManual">Ekle</button><button data-act="toggleManual">Yapay zekayla</button></div>`
    : `
      <textarea id="foodTx" data-draft="food" placeholder="ör. 2 haşlanmış yumurta, 1 dilim beyaz peynir, 5 zeytin, 2 dilim tam buğday ekmeği">${esc(draft.food)}</textarea>
      <div class="row" style="margin-top:10px"><button class="pri grow" data-act="calcFood">✨ Kaloriyi hesapla</button><button data-act="toggleManual">Elle gir</button></div>`}
    ${S.recent.length ? `<div class="hint" style="margin:12px 0 6px">Son yediklerin · dokun, seçili öğüne ekle</div>
      <div class="chips">${S.recent.slice(0, 14).map((r, i) => `<button class="chip" data-act="recent" data-i="${i}">${esc(r.name)} <small>${r.kcal}</small></button>`).join("")}</div>` : ""}
  </div>`;

  if (draft.preview) {
    const p = draft.preview;
    h += `<div class="card prev" id="prev"><h3>Kontrol et · ${esc(p.meal)}</h3>
      ${p.items.map((it, i) => `<div class="item"><input type="checkbox" data-pi="${i}" ${it.on ? "checked" : ""}>
        <div class="nm">${esc(it.name)}<small>${esc(it.amount)} · P ${it.p} · K ${it.c} · Y ${it.f}</small></div>
        <input type="number" inputmode="numeric" data-pk="${i}" value="${it.kcal}"></div>`).join("")}
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
      <div class="row" style="margin-top:12px"><button class="pri grow" data-act="confirmPrev">Öğüne ekle</button><button data-act="cancelPrev">Vazgeç</button></div></div>`;
  }

  // Yenenler
  const anyFood = d.foods.length;
  h += `<div class="sec">${isToday ? "Bugün yediklerin" : "Yenenler"}</div><div class="card">${anyFood ? MEALS.map(m => {
    const fs = d.foods.filter(f => f.meal === m); if (!fs.length) return "";
    return `<div class="meal"><h4><span>${MEAL_EMOJI[m]} ${m}</span><span class="mu">${fmt(fs.reduce((a, f) => a + num(f.kcal), 0))} kcal</span></h4>
      ${fs.map(f => `<div class="item"><div class="nm">${esc(f.name)}${f.amount ? `<small>${esc(f.amount)}</small>` : ""}</div>
        <button class="kc" data-act="editFood" data-id="${f.id}">${f.kcal} kcal</button><button class="del" data-act="delFood" data-id="${f.id}" aria-label="Sil">×</button></div>`).join("")}</div>`;
  }).join("") : `<p class="mu sm" style="margin:0">Henüz bir şey girilmedi. Yukarıdan bir öğün seç.</p>`}</div>`;

  // Su
  const glasses = Math.round(d.waterMl / GLASS), gGoal = Math.round(waterGoal / GLASS);
  h += `<div class="card"><div class="row sp"><h3 style="margin:0">💧 Su</h3>
      <div class="seg mini"><button data-act="wunit" data-u="bardak" class="${unit === "bardak" ? "on" : ""}">Bardak</button><button data-act="wunit" data-u="litre" class="${unit === "litre" ? "on" : ""}">Litre</button></div></div>
    <div class="row sp" style="margin-top:10px"><b style="font-size:20px">${waterText(d.waterMl)}</b><span class="mu sm">hedef ${waterText(waterGoal)}</span></div>
    <div class="wbar"><i style="width:${Math.min(d.waterMl / waterGoal * 100, 100)}%"></i></div>
    ${unit === "bardak" ? `
      <div class="glasses">${Array.from({ length: Math.max(gGoal, glasses) }, (_, i) => `<div class="glass ${i < glasses ? "on" : ""}"></div>`).join("")}</div>
      <div class="wq"><button data-act="water" data-ml="-250">− 1 bardak</button><button data-act="water" data-ml="250">+ 1 bardak</button></div>
      <div class="hint">1 bardak = 250 ml</div>`
    : `
      <div class="wq"><button data-act="water" data-ml="250">+0,25 L</button><button data-act="water" data-ml="500">+0,5 L</button><button data-act="water" data-ml="1000">+1 L</button><button data-act="water" data-ml="-250">−0,25 L</button></div>
      <div class="row" style="margin-top:10px"><input id="wL" type="number" inputmode="decimal" step="0.1" placeholder="Toplam litre (ör. 1,8)" class="grow"><button data-act="setWater">Ayarla</button></div>`}
  </div>`;

  // Egzersiz
  h += `<div class="card"><h3>🏋️ Spor / antrenman</h3>
    ${d.exercises.map(e => `<div class="item"><div class="nm">${esc(e.desc)}${e.ozet ? `<small>${esc(e.ozet)}</small>` : ""}</div>
      <span class="kc">−${e.kcal}</span><button class="del" data-act="delEx" data-id="${e.id}" aria-label="Sil">×</button></div>`).join("")}
    ${draft.exManual ? `
      <div class="row" style="margin-top:10px"><input id="exName" placeholder="ör. Koşu" class="grow"><input id="exKcal" type="number" inputmode="numeric" placeholder="kcal" style="width:90px"></div>
      <div class="row" style="margin-top:10px"><button class="pri grow" data-act="addExManual">Ekle</button><button data-act="toggleEx">Tarif et</button></div>`
    : `<textarea data-draft="ex" placeholder="ör. 10 dk ısınma, 4x10 squat 60 kg, 3x12 bench press 50 kg, 20 dk yürüyüş bandı">${esc(draft.ex)}</textarea>
      <div class="row" style="margin-top:10px"><button class="pri grow" data-act="calcEx">✨ Yakılan kaloriyi hesapla</button><button data-act="toggleEx">Kcal gir</button></div>`}
    <div class="hint">Yakılan kalori bugünkü hedefine eklenir ve program hazırlanırken dikkate alınır.</div>
  </div>`;

  // Değerlendirme
  const rv = d.review;
  if (rv) h += reviewCard(rv, d);
  else h += `<div class="card"><h3>🌙 Gün sonu</h3><p class="mu sm">Bugün başka bir şey yemeyeceksen günü bitir; toplamı hesaplayıp hedefine göre değerlendireyim, fazlalık varsa neleri çıkarman gerektiğini söyleyeyim.</p>
    <button class="pri full" data-act="review" ${anyFood ? "" : "disabled"}>Günü bitir ve değerlendir</button></div>`;

  el.innerHTML = h;
}

function reviewCard(rv, d) {
  const sc = Math.max(1, Math.min(10, Math.round(num(rv.puan) || 5)));
  const scCol = sc >= 8 ? "var(--ac)" : sc >= 5 ? "var(--warn)" : "var(--bad)";
  const stale = rv.sig !== daySig(d);
  const cuts = arr(rv.cikarilacaklar);
  const li = a => arr(a).length ? `<ul class="l">${arr(a).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="card" id="review">
    <div class="rv-head"><div class="score" style="background:${scCol}">${sc}</div>
      <div class="grow"><b>${esc(rv.baslik || "Günün değerlendirmesi")}</b><p style="margin:4px 0 0">${esc(rv.ozet || "")}</p></div></div>
    ${stale ? `<div class="warnbox">Değerlendirmeden sonra kayıtlar değişti. Güncel hâli için yeniden değerlendir.</div>` : ""}
    ${num(rv.fazlaKalori) > 0 && cuts.length ? `<h4>≈ ${fmt(num(rv.fazlaKalori))} kcal fazlayı dengelemek için</h4>
      ${cuts.map(c => `<div class="cut"><div class="row sp"><b>${esc(c.besin)}</b><span class="b" style="color:var(--bad)">−${fmt(num(c.kcal))} kcal</span></div>
        <div class="sm mu">${esc(c.neden || "")}</div>${c.yerine ? `<div class="sm" style="margin-top:4px">↪ Yerine: ${esc(c.yerine)}</div>` : ""}</div>`).join("")}` : ""}
    ${arr(rv.iyiler).length ? `<h4>👍 İyi gidenler</h4>${li(rv.iyiler)}` : ""}
    ${arr(rv.gelistirilecekler).length ? `<h4>🔧 Geliştirilecekler</h4>${li(rv.gelistirilecekler)}` : ""}
    ${arr(rv.eksikler).length ? `<h4>Eksik kalanlar</h4><div class="chips">${arr(rv.eksikler).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
    ${rv.yarinIcin ? `<div class="note"><b>Yarın için:</b> ${esc(rv.yarinIcin)}</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="grow" data-act="review">Yeniden değerlendir</button><button class="dan" data-act="clearReview">Kaldır</button></div>
  </div>`;
}

    ${g ? `<div style="margin-top:6px">${arr(g.ogunler).map(o => `<div class="pm"><div class="row sp"><b>${esc(o.ogun)}</b><span class="mu sm">${fmt(num(o.kcal))} kcal</span></div>
      <div style="margin-top:3px">${esc(o.icerik)}</div></div>`).join("")}
      <div class="row sp" style="border-top:1px solid var(--ln);padding-top:10px"><b>Toplam</b><b>${fmt(num(g.toplamKcal) || arr(g.ogunler).reduce((a, o) => a + num(o.kcal), 0))} kcal</b></div></div>` : ""}
  </div>

  ${tg.sporNot ? `<div class="card"><h3>🏋️ Spor günlerinde</h3><p style="margin:0">${esc(tg.sporNot)}</p></div>` : ""}
  ${arr(tg.notlar).length ? `<div class="card"><h3>Önemli notlar</h3><ul class="l">${arr(tg.notlar).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  ${arr(pl.ipuclari).length ? `<div class="card"><h3>İpuçları</h3><ul class="l">${arr(pl.ipuclari).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}

function adaptiveCard() {
  const a = adaptive(), tg = S.targets;
  const hist = arr(tg.history).slice(-3).reverse();
  const histHtml = hist.length ? `<h4>Geçmiş ayarlamalar</h4>${hist.map(x => `<div class="item"><div class="nm">${esc(new Date(x.at).toLocaleDateString("tr-TR"))}</div><span class="mu">${fmt(x.from)} → <b>${fmt(x.to)}</b> kcal</span></div>`).join("")}` : "";
  if (!a?.ready) {
    const step = (ok, txt) => `<li>${ok ? "✅" : "⬜"} ${txt}</li>`;
    return `<div class="card adj"><h3>📈 Haftalık kontrol</h3>
      <p class="sm mu" style="margin-top:0">Yediklerin ve kilon kaydedildikçe gerçek kalori harcamanı hesaplayıp hedefini otomatik olarak önereceğim. Kilo vermiyorsan azaltma, çok hızlı veriyorsan artırma önerisi gelir.</p>
      <ul class="l" style="list-style:none;padding-left:0">
        ${step(a.nDays >= a.need.days, `En az ${a.need.days} gün tam kayıt (şu an ${a.nDays})`)}
        ${step(a.nW >= a.need.weights, `Son 3 haftada en az ${a.need.weights} tartı (şu an ${a.nW})`)}
        ${step(a.span >= a.need.span, `Tartılar arası en az ${a.need.span} gün (şu an ${a.span})`)}
      </ul><div class="hint">İpucu: Haftada 2-3 kez, sabah aç karnına tartıl. Günü bitirmeyi unutma.</div>${histHtml}</div>`;
  }
  const col = { iyi: "var(--ac-d)", uyum: "var(--warn)", hizli: "var(--bad)", yavas: "var(--warn)", fazla: "var(--warn)" }[a.status];
  const icon = { iyi: "✅", uyum: "🎯", hizli: "⚠️", yavas: "🐢", fazla: "🚀" }[a.status];
  return `<div class="card adj"><h3>📈 Haftalık kontrol</h3>
    <p style="margin:0;color:${col};font-weight:600">${icon} ${esc(a.msg)}</p>
    <div class="kv">
      <span>Ortalama alınan</span><b>${fmt(a.avgIn)} kcal</b>
      <span>Ortalama hedef</span><b>${fmt(a.avgTarget)} kcal</b>
      <span>Kilo değişimi</span><b>${a.weekly > 0 ? "+" : ""}${a.weekly.toFixed(2).replace(".", ",")} kg/hafta</b>
      <span>Hedeflenen</span><b>${a.goalWeekly > 0 ? "+" : ""}${a.goalWeekly.toFixed(2).replace(".", ",")} kg/hafta</b>
      <span>Gerçek harcama (tahmini)</span><b>${fmt(a.realTdee)} kcal</b>
    </div>
    ${a.suggest != null ? `<div class="note" style="margin-top:12px"><div class="row sp"><span>Önerilen yeni hedef</span><span class="big2">${fmt(a.suggest)} <small class="sm mu">kcal</small></span></div>
      <div class="sm mu">Şu anki: ${fmt(tg.kcal)} kcal · Değişim bir seferde en fazla 250 kcal.</div>
      <div class="row" style="margin-top:10px"><button class="pri grow" data-act="applyAdj" data-v="${a.suggest}">Hedefi güncelle</button><button data-act="applyAdj" data-v="${a.suggest}" data-plan="1">Güncelle + yeni program</button></div></div>` : ""}
    <div class="hint" style="margin-top:8px">Son ${a.nDays} günlük kayda ve ${a.nW} tartıya göre hesaplandı.${String(S.profile.ozel).startsWith("emzirme") || S.profile.ozel === "lohusa" ? " Doğum sonrası ödem atımı ilk haftalarda kiloyu olduğundan hızlı düşürebilir." : " Kısa vadeli su tutulması sonucu etkileyebilir."}</div>
    ${histHtml}</div>`;
}

  const tgtKg = num(S.profile?.hedefKilo) || null;

  if (wRange) { const from = addDays(ymd(new Date()), -wRange); list = all.filter(w => w.date >= from); }
  const first = all[0], last = all[all.length - 1];
  const ch = first && last ? last.kg - first.kg : 0;
  el.innerHTML = `
  <div class="card">
    <h3>Kilo ekle</h3>
    <div class="row"><input id="wKg" type="number" inputmode="decimal" step="0.1" placeholder="kg" class="grow" value="">
      <input id="wDate" type="date" value="${ymd(new Date())}" max="${ymd(new Date())}" style="width:150px"></div>
    <button class="pri full" style="margin-top:10px" data-act="addW">Kaydet</button>
  </div>
  ${all.length ? `<div class="card">

      <div><b>${tgtKg ? (last.kg - tgtKg).toFixed(1).replace(".", ",") : "–"}</b><span>hedefe kalan</span></div>

    <div style="margin-top:10px">${chart(list, tgtKg)}</div>

  <div class="card"><h3>Ölçümler</h3>${[...all].reverse().map(w => `<div class="item"><div class="nm">${esc(trDate(w.date, { day: "numeric", month: "long", year: "numeric" }))}</div>
    <b>${w.kg.toLocaleString("tr-TR")} kg</b><button class="del" data-act="delW" data-d="${w.date}" aria-label="Sil">×</button></div>`).join("")}</div>`
  : `<div class="card empty"><div class="e">⚖️</div><p class="mu">Düzenli tartıldıkça kilo grafiğin burada oluşacak.</p></div>`}`;
}
function chart(list, target) {
  if (list.length < 2) return `<p class="mu sm" style="text-align:center">Grafik için bu aralıkta en az 2 ölçüm gerekli.</p>`;
  const W = 340, H = 190, pl = 36, pr = 10, pt = 12, pb = 26;
  const xs = list.map(w => new Date(w.date + "T12:00:00").getTime()), ys = list.map(w => w.kg);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (target && target >= lo - 5 && target <= hi + 5) { lo = Math.min(lo, target); hi = Math.max(hi, target); }
  lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5); if (hi - lo < 2) hi = lo + 2;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const X = t => pl + (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0)) * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const pts = list.map((w, i) => [X(xs[i]), Y(w.kg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z`;
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--ln)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--mu)">${v.toFixed(v % 1 ? 1 : 0)}</text>`;
  }
  const lbl = s => new Date(s + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  const tl = target && target >= lo && target <= hi
    ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ac)" stroke-dasharray="4 4"/><text x="${W - pr}" y="${Y(target) - 4}" text-anchor="end" font-size="10" fill="var(--ac)">hedef ${target}</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".28"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${tl}<path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--card)" stroke="var(--ac)" stroke-width="2"/>`).join("")}
    <text x="${pl}" y="${H - 6}" font-size="10" fill="var(--mu)">${lbl(list[0].date)}</text>
    <text x="${W - pr}" y="${H - 6}" font-size="10" fill="var(--mu)" text-anchor="end">${lbl(list[list.length - 1].date)}</text></svg>`;
}

function saveProfile(form) {
  const fd = Object.fromEntries(new FormData(form).entries());
  if (!fd.amac.trim()) return toast("Amacını yaz", 1);
  if (num(fd.yas) < 18) return toast("Bu uygulama yetişkinler içindir", 1);
  const isNew = !S.profile;
  const kg = r1(fd.kilo);
  S.profile = { ...fd, kilo: kg, updatedAt: Date.now() };
  const lw = latestWeight();
  if (lw === null || Math.abs(lw - kg) >= 0.05) {
    const today = ymd(new Date());
    S.weights = S.weights.filter(w => w.date !== today).concat({ date: today, kg });
  }
  save();
  if (isNew || !S.targets) {
    if (S.settings.workerUrl) makePlan();
    else { toast("Kaydedildi. Program için Ayarlar'a Worker adresini gir."); renderProfile(); setTimeout(() => $("#wurl")?.focus(), 200); }
  } else { toast("Kaydedildi"); renderProfile(); }
}

}

    export: exportData,

    reset: () => { if (confirm("Tüm kayıtların silinecek" + (Cloud.user ? " (buluttakiler dahil)" : "") + ". Emin misin?") && confirm("Geri alınamaz. Siliyorum?")) { const u = S.settings.workerUrl; S = defaults(); S.settings.workerUrl = u; save(); go("profile"); } },
    logout: () => { if (confirm("Çıkış yapılsın mı? Kayıtların bulutta kalır.")) Cloud.logout(); },
    login: () => Cloud.auth("login"), signup: () => Cloud.auth("signup"), forgot: () => Cloud.auth("forgot"),
  };
  if (H[act]) { e.preventDefault(); H[act](); }
});

async function exportData() {
  const name = `fittrack-yedek-${ymd(new Date())}.json`;
  const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Fit Track yedeği" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o !== "object" || !("days" in o)) throw 0;
      if (!confirm("Mevcut verilerin yedektekilerle değiştirilecek. Devam?")) return;
      const u = S.settings.workerUrl; S = Object.assign(defaults(), o); if (!S.settings.workerUrl) S.settings.workerUrl = u;
      save(); toast("Yedek yüklendi"); go("today");
    } catch (e) { toast("Geçersiz yedek dosyası", 1); }
  };
  r.readAsText(file);
}

/* ============ Bulut (Firebase) ============ */
const Cloud = {
  fb: null, user: null, last: { meta: null, days: {} }, timer: null, pending: false, online: navigator.onLine, unsub: [],
  statusText() { return !this.online ? "Çevrimdışı – bağlantı gelince eşitlenecek." : this.pending ? "Eşitleniyor…" : "Eşitlendi ✓"; },
  meta(s = S) { const { days, ...m } = s; return JSON.parse(JSON.stringify(m)); },
  clean(o) { return JSON.parse(JSON.stringify(o)); },
  isEmptyDay(d) { return !d || (!d.foods?.length && !d.exercises?.length && !d.waterMl && !d.review); },

  async init() {
    if (!FIREBASE_CONFIG) { go(S.profile ? "today" : "profile"); return; }
    showAuth("loading");
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [appM, authM, fsM] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
      const app = appM.initializeApp(FIREBASE_CONFIG);
      const auth = authM.getAuth(app);
      await authM.setPersistence(auth, authM.indexedDBLocalPersistence).catch(() => {});
      let db;
      try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache() }); } catch (e) { db = fsM.getFirestore(app); }
      this.fb = { authM, fsM, auth, db };
      authM.onAuthStateChanged(auth, u => this.onUser(u));
    } catch (e) {
      // Firebase yüklenemezse (ör. ilk açılış çevrimdışı) son kullanıcının yerel verisiyle aç
      const lastUid = localStorage.getItem("fittrack_last_uid");
      if (lastUid) { storeKey = KEY + "_" + lastUid; S = load(); hideAuth(); go(S.profile ? "today" : "profile"); toast("Çevrimdışı açıldı; bağlantı gelince yeniden aç.", 1); }
      else showAuth("login", "Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.");
    }
    addEventListener("online", () => { this.online = true; this.flush(); });
    addEventListener("offline", () => { this.online = false; });
  },

  async onUser(u) {
    this.unsub.forEach(f => f()); this.unsub = [];
    this.user = u;
    if (!u) { S = defaults(); storeKey = KEY; showAuth("login"); return; }
    localStorage.setItem("fittrack_last_uid", u.uid);
    storeKey = KEY + "_" + u.uid;
    S = load();                         // önce yerel önbellek: anında açılır
    hideAuth(); go(S.profile ? "today" : "profile");
    try { await this.pull(true); } catch (e) { console.warn(e); }
    this.listen();
  },

  ref(...p) { const { fsM, db } = this.fb; return p.length % 2 ? fsM.collection(db, "users", this.user.uid, ...p) : fsM.doc(db, "users", this.user.uid, ...p); },

  async pull(first) {
    const { fsM } = this.fb;
    const [mSnap, dSnap] = await Promise.all([fsM.getDoc(fsM.doc(this.fb.db, "users", this.user.uid)), fsM.getDocs(this.ref("days"))]);
    const remoteDays = {}; dSnap.forEach(x => remoteDays[x.id] = x.data());
    if (!mSnap.exists() && !dSnap.size) {
      // Bulutta hiç veri yok: bu cihazdaki (giriş öncesi) verileri taşı
      const legacy = load(KEY), mine = load();
      const src = mine.profile || Object.keys(mine.days).length ? mine : legacy;
      if (src.profile || Object.keys(src.days).length) { S = src; if (src === legacy) toast("Bu cihazdaki kayıtların hesabına aktarılıyor"); }
      this.last = { meta: null, days: {} };
      save(); await this.flush(); this.afterPull();
    } else {
      const m = mSnap.exists() ? mSnap.data() : {};
      S = Object.assign(defaults(), m, { days: remoteDays });
      if (!S.settings?.workerUrl) S.settings = { ...(S.settings || {}), workerUrl: DEFAULT_WORKER };
      this.last.meta = JSON.stringify(this.meta());
      this.last.days = {}; Object.entries(remoteDays).forEach(([k, v]) => this.last.days[k] = JSON.stringify(v));
      try { localStorage.setItem(storeKey, JSON.stringify(S)); } catch (e) {}
      this.afterPull();
    }
  },
  afterPull() { if (view === "profile" && S.profile && !document.activeElement?.closest?.("#pf")) go("today"); else render(); },

  listen() {
    const { fsM } = this.fb;
    // Diğer cihazlardan gelen değişiklikleri canlı al
    this.unsub.push(fsM.onSnapshot(fsM.doc(this.fb.db, "users", this.user.uid), snap => {
      if (snap.metadata.hasPendingWrites || !snap.exists()) return;
      const str = JSON.stringify(snap.data());
      if (str === this.last.meta) return;
      this.last.meta = str; const days = S.days; S = Object.assign(defaults(), snap.data(), { days }); this.saveLocal(); this.softRender();
    }));
    this.unsub.push(fsM.onSnapshot(this.ref("days"), snap => {
      let changed = false;
      snap.docChanges().forEach(ch => {
        if (ch.doc.metadata.hasPendingWrites) return;
        const k = ch.doc.id;
        if (ch.type === "removed") { if (S.days[k]) { delete S.days[k]; delete this.last.days[k]; changed = true; } return; }
        const str = JSON.stringify(ch.doc.data());
        if (str === this.last.days[k]) return;
        this.last.days[k] = str; S.days[k] = ch.doc.data(); changed = true;
      });
      if (changed) { this.saveLocal(); this.softRender(); }
    }));
  },
  saveLocal() { try { localStorage.setItem(storeKey, JSON.stringify(S)); } catch (e) {} },
  softRender() { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; render(); },

  schedule() {
    if (!this.user || !this.fb) return;
    this.pending = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 700);
  },
  async flush() {
    if (!this.user || !this.fb) return;
    clearTimeout(this.timer);
    const { fsM, db } = this.fb, uid = this.user.uid, ops = [];
    const m = this.meta(), ms = JSON.stringify(m);
    if (ms !== this.last.meta) { ops.push(fsM.setDoc(fsM.doc(db, "users", uid), m)); this.last.meta = ms; }
    const keys = new Set([...Object.keys(S.days), ...Object.keys(this.last.days)]);
    keys.forEach(k => {
      const d = S.days[k];
      if (this.isEmptyDay(d)) {
        if (this.last.days[k] !== undefined) { ops.push(fsM.deleteDoc(fsM.doc(db, "users", uid, "days", k))); delete this.last.days[k]; }
        return;
      }
      const c = this.clean(d), s = JSON.stringify(c);
      if (s !== this.last.days[k]) { ops.push(fsM.setDoc(fsM.doc(db, "users", uid, "days", k), c)); this.last.days[k] = s; }
    });
    // Çevrimdışıyken yazmalar Firestore önbelleğinde kuyruğa girer, bağlantı gelince gönderilir
    try { await Promise.all(ops); this.pending = false; }
    catch (e) { console.warn(e); this.last.meta = null; toast("Buluta kaydedilemedi: " + (e.code || e.message), 1); }
  },

  async auth(mode) {
    const { authM, auth } = this.fb || {};
    if (!auth) return;
    const email = $("#auEmail").value.trim(), pass = $("#auPass").value;
    const err = m => { $("#auErr").textContent = m; };
    err("");
    try {
      if (mode === "forgot") {
        if (!email) return err("E-posta adresini yaz.");
        await authM.sendPasswordResetEmail(auth, email); return err("Şifre sıfırlama bağlantısı e-postana gönderildi.");
      }
      if (!email || !pass) return err("E-posta ve şifre gir.");
      busy(mode === "signup" ? "Hesap oluşturuluyor…" : "Giriş yapılıyor…");
      if (mode === "signup") {
        if (pass.length < 6) { busy(); return err("Şifre en az 6 karakter olmalı."); }
        await authM.createUserWithEmailAndPassword(auth, email, pass);
      } else await authM.signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      const M = { "auth/invalid-credential": "E-posta veya şifre hatalı.", "auth/wrong-password": "Şifre hatalı.", "auth/user-not-found": "Bu e-postayla hesap yok. Hesap oluştur.",
        "auth/email-already-in-use": "Bu e-postayla zaten hesap var. Giriş yap.", "auth/invalid-email": "Geçersiz e-posta adresi.", "auth/weak-password": "Şifre en az 6 karakter olmalı.",
        "auth/too-many-requests": "Çok fazla deneme. Biraz bekle.", "auth/network-request-failed": "İnternet bağlantısı yok.", "auth/unauthorized-domain": "Bu adres Firebase'de yetkili değil (Authorized domains)." };
      err(M[e.code] || e.message);
    } finally { busy(); }
  },
  async logout() { await this.flush(); await this.fb.authM.signOut(this.fb.auth); }
};

function showAuth(mode, msg) {
  let el = $("#auth");
  if (!el) { el = document.createElement("div"); el.id = "auth"; document.body.appendChild(el); }
  el.style.display = "flex";
  el.innerHTML = mode === "loading"
    ? `<div class="spin" style="border-color:var(--ac2);border-top-color:var(--ac)"></div>`
    : `<div class="aubox">
        <div class="aulogo">🥗</div><h2>Fit Track</h2><p class="mu sm" style="margin:0 0 14px">Beslenme programın ve kalori takibin, tüm cihazlarında.</p>
        <input id="auEmail" type="email" placeholder="E-posta" autocomplete="username" autocapitalize="off">
        <input id="auPass" type="password" placeholder="Şifre" autocomplete="current-password" style="margin-top:10px">
        <div id="auErr" class="sm" style="color:var(--bad);min-height:20px;margin:8px 2px">${esc(msg || "")}</div>
        <button class="pri full" data-act="login">Giriş yap</button>
        <button class="full" data-act="signup" style="margin-top:8px">Hesap oluştur</button>
        <button class="ghost full" data-act="forgot" style="margin-top:4px">Şifremi unuttum</button>
      </div>`;
}
function hideAuth() { const el = $("#auth"); if (el) el.style.display = "none"; }
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "auPass") Cloud.auth("login"); });

/* ============ Başlat ============ */
Cloud.init();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && view === "today") { const t = ymd(new Date()); if (curDate !== t && !S.days[curDate]?.foods?.length) { curDate = t; } renderToday(); }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
